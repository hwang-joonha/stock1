<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>추정 모델</title>
<style>

/* Financial Modeling DS — fonts (Outfit for heading, Pretendard for body). 토큰: design-guide/tokens.js */
/* 웹폰트를 받아오지 않는다. 설치돼 있으면 쓰고, 없으면 시스템 한글 폰트로
   떨어진다 — 아래 폴백 스택이 그 역할을 한다. */
*{margin:0;padding:0;box-sizing:border-box}
/* light.bg #FFFFFF, light.surface #F8F8FA, text.light.primary #0F0F12 */
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,system-ui,sans-serif;background:#F8F8FA;color:#0F0F12;overflow:hidden;height:100vh;width:100vw}
canvas#c{display:block;width:100%;height:100%}
.hud{position:fixed;z-index:100;background:#FFFFFF;border:1px solid #E5E5E8;border-radius:6px;padding:6px 12px;font-size:11px;color:#4B5563;box-shadow:0 2px 8px rgba(0,0,0,.06);user-select:none}
.top-bar{top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;max-width:calc(100vw - 28px);overflow-x:auto;overflow-y:hidden;white-space:nowrap}
.top-bar button{height:26px;border:1px solid #D1D5DB;border-radius:4px;background:#FFFFFF;cursor:pointer;font-size:11px;color:#374151;padding:0 10px;font-family:'Pretendard',sans-serif;line-height:24px;white-space:nowrap;flex:0 0 auto}
.top-bar button:hover{background:#F3F4F6}
.top-bar .sep{width:1px;height:18px;background:#E5E5E8;flex:0 0 auto}
.top-bar #selLabel{white-space:nowrap;flex:0 0 auto}
#zoom-label{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;flex:0 0 auto}
.legend{bottom:12px;left:12px;font-size:10px;line-height:1.8}
.legend span{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:3px}
.hint{bottom:12px;right:12px;font-size:10px;color:#9CA3AF;text-align:right;line-height:1.6}
.popup-overlay{position:fixed;top:0;left:0;right:0;height:100%;transition:right .3s;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.25)}
.popup-overlay.show{display:flex}
.popup{background:#FFFFFF;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.15);padding:24px 28px 20px;min-width:520px;max-width:700px;max-height:85vh;overflow-y:auto;position:relative}
.popup-close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:18px;cursor:pointer;color:#9CA3AF;padding:4px}
.popup-close:hover{color:#374151}
.popup h3{font-size:14px;font-weight:600;margin-bottom:2px;color:#0F0F12}
.popup .popup-sub{font-size:11px;color:#9CA3AF;margin-bottom:16px}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding:0 2px}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.chart-bar{width:100%;border-radius:3px 3px 0 0;min-height:2px;transition:height .3s}
.chart-val{font-size:9px;font-family:Pretendard,sans-serif;color:#4B5563;font-weight:500;text-align:center;white-space:nowrap}
.chart-yr{font-size:9px;font-family:Pretendard,sans-serif;color:#9CA3AF;text-align:center}
.chart-bar-wrap:hover .chart-val{color:#0F0F12;font-weight:700}
.chart-table{width:100%;border-collapse:collapse;margin-top:10px}
.chart-table th{font-size:9px;color:#9CA3AF;font-weight:400;text-align:right;padding:2px 5px;border-bottom:1px solid #F3F4F6}
.chart-table td{font-size:10px;font-family:Pretendard,sans-serif;text-align:right;padding:2px 5px;color:#374151}
.chart-table tr:hover td{background:#F8F8FA}
.chart-unit{font-size:9px;color:#D1D5DB;text-align:right;margin-top:3px}
.ds-section{margin-bottom:14px}
.ds-label{font-size:11px;font-weight:600;color:#374151;margin-bottom:6px}
.ds-desc{font-size:10px;color:#9CA3AF;margin-bottom:8px;line-height:1.5}

#right{width:0;overflow:hidden;transition:width .3s;border-left:1px solid #E5E5E8;background:#FFFFFF;display:flex;flex-direction:column;flex-shrink:0}
#right.open{width:400px}
.sp-head{padding:10px 14px;border-bottom:1px solid #F3F4F6;display:flex;align-items:center;gap:8px;flex-shrink:0}
.sp-head h3{font-size:13px;font-weight:600;flex:1}
.sp-head button{width:24px;height:24px;border:none;background:none;cursor:pointer;font-size:15px;color:#9CA3AF;border-radius:4px}
.sp-head button:hover{background:#F3F4F6;color:#374151}
.sp-body{flex:1;overflow-y:auto;padding:12px 14px}
.sp-sec{font-size:11px;font-weight:600;color:#374151;margin:14px 0 6px;padding-bottom:3px}
.sp-row{margin-bottom:10px}
.sp-label{display:flex;justify-content:space-between;font-size:10px;color:#4B5563;margin-bottom:2px}
.sp-label .sp-val{font-family:Pretendard,sans-serif;font-weight:500;color:#374151}
.sp-track{position:relative;height:18px;display:flex;align-items:center}
.sp-track input[type=range]{width:100%;margin:0;-webkit-appearance:none;appearance:none;height:4px;background:#E5E7EB;border-radius:2px;outline:none}
.sp-track input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#374151;cursor:pointer;border:2px solid #FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sp-track .sp-mark{position:absolute;top:50%;width:2px;height:10px;background:#5D68F7;border-radius:1px;transform:translate(-50%,-50%);pointer-events:none;z-index:1}
.sp-yrs{display:flex;gap:2px;margin-bottom:10px}
.sp-yr{flex:1;padding:3px 0;font-size:9px;text-align:center;border:1px solid #E5E7EB;border-radius:3px;background:#FFFFFF;cursor:pointer;font-family:Pretendard,sans-serif;color:#888}
.sp-yr.active{background:#374151;color:#FFFFFF;border-color:#374151}
.sp-rst{font-size:9px;color:#5D68F7;cursor:pointer;font-weight:500}
.sp-rst:hover{text-decoration:underline}

#simPanel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#374151;cursor:pointer;border:2px solid #FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* === 노드 편집 UI (Full 모드) === */
/* 컨텍스트 메뉴 */
.ctx-menu{position:fixed;background:#FFFFFF;border:1px solid #E5E5E8;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:4px 0;font-size:12px;z-index:300;min-width:160px;font-family:'Pretendard',sans-serif}
.ctx-menu-item{padding:7px 14px;cursor:pointer;color:#0F0F12;user-select:none}
.ctx-menu-item:hover{background:#F8F8FA}
.ctx-menu-item.danger{color:#DC2626}
.ctx-menu-sep{height:1px;background:#E5E5E8;margin:4px 0}
/* 편집 폼 */
.edit-form label{display:block;font-size:11px;color:#6B7280;margin:12px 0 4px;font-weight:500}
.edit-form input[type=text],.edit-form select,.edit-form textarea{width:100%;padding:8px 10px;font-size:13px;border:1px solid #E5E5E8;border-radius:4px;font-family:'Pretendard',sans-serif;background:#FFFFFF;color:#0F0F12;outline:none;box-sizing:border-box}
.edit-form input[type=text]:focus,.edit-form textarea:focus,.edit-form select:focus{border-color:#5D68F7}
.edit-form textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;min-height:60px;resize:vertical}
.edit-form .hint{font-size:10px;color:#9CA3AF;margin-top:3px}
.edit-form .error{font-size:11px;color:#DC2626;margin-top:8px;padding:8px 10px;background:#FFFFFF;border:1px solid #DC2626;border-radius:4px;display:none}
.edit-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.edit-actions button{padding:7px 14px;font-size:12px;border-radius:4px;border:1px solid #E5E5E8;background:#FFFFFF;color:#0F0F12;cursor:pointer;font-family:'Pretendard',sans-serif;font-weight:500}
.edit-actions button:hover{background:#F8F8FA}
.edit-actions button.primary{background:#5D68F7;color:#FFFFFF;border-color:#5D68F7}
.edit-actions button.primary:hover{background:#3332D0}
.edit-actions button.danger{color:#DC2626;border-color:#DC2626}
.edit-actions button.danger:hover{background:#FFFFFF}

/* ============================================================
   APP SHELL — 사이드바 + 탑바 + 뷰 라우터
   색상은 전부 design-guide/tokens.js 토큰. 임의 hex 없음.
   ============================================================ */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100vh;width:100vw;overflow:hidden}

/* ---------- Sidebar (dark.bg #0F0F12 / dark.card #1A1A1F / dark.border #2A2A2F) ---------- */
.sidebar{position:relative;z-index:60;display:flex;flex-direction:column;min-width:0;
  background:#0F0F12;/* dark.bg */border-right:1px solid #2A2A2F;/* dark.border */}
.brand{padding:18px 18px 14px;border-bottom:1px solid #2A2A2F}
.brand-mark{display:flex;align-items:center;gap:10px}
.brand-logo{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;
  background:#1E2185;/* semantic.revenue / primary.900 */color:#FFFFFF;
  font-family:'Outfit',system-ui,sans-serif;font-weight:700;font-size:14px}
.brand-name{font-family:'Outfit',system-ui,sans-serif;font-size:14px;font-weight:600;
  letter-spacing:-.02em;color:#FFFFFF;/* text.dark.primary */line-height:1.2}
.brand-sub{font-size:9px;color:#6B7280;/* text.dark.secondary */margin-top:3px;
  letter-spacing:.08em;text-transform:uppercase}
.side-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 8px 20px}
.side-scroll::-webkit-scrollbar{width:6px}
.side-scroll::-webkit-scrollbar-thumb{background:#2A2A2F;border-radius:3px}
.nav-group{margin-bottom:16px}
.nav-caption{padding:0 10px 6px;color:#6B7280;font-size:9px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.nav-caption .cap-count{margin-left:auto;color:#4B5563;letter-spacing:0;font-weight:600}
.nav-item{width:100%;border:0;background:transparent;color:#9CA3AF;/* text.dark.body */
  display:flex;align-items:center;gap:8px;min-height:32px;padding:6px 10px;margin:1px 0;
  border-radius:5px;cursor:pointer;text-align:left;font-size:11.5px;font-weight:500;
  font-family:'Pretendard',-apple-system,sans-serif;position:relative}
.nav-item:hover{background:#1A1A1F;/* dark.card */color:#FFFFFF}
.nav-item.active{background:#1A1A1F;color:#FFFFFF}
.nav-item.active:before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;
  border-radius:1px;background:#5D68F7;/* semantic.input / primary.500 */}
.nav-item .ico{width:16px;height:16px;flex:0 0 auto;opacity:.75;display:grid;place-items:center}
.nav-item.active .ico{opacity:1}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-val{font-size:9.5px;font-variant-numeric:tabular-nums;color:#6B7280;font-weight:600;flex:0 0 auto}
.nav-item.active .nav-val{color:#A1B8FF;/* primary.300 */}

/* 트리형 사이드바 노드 */
.tree-item{display:flex;align-items:center;gap:4px;margin:1px 0;border-radius:5px;position:relative}
.tree-item:hover{background:#1A1A1F}
.tree-item.active{background:#1A1A1F}
.tree-item.active:before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;
  border-radius:1px;background:#5D68F7}
.tree-caret{width:16px;height:24px;flex:0 0 auto;border:0;background:transparent;cursor:pointer;
  display:grid;place-items:center;padding:0;color:#4B5563}
.tree-caret:hover{color:#9CA3AF}
.tree-caret svg{transition:transform .15s}
.tree-caret.open svg{transform:rotate(90deg)}
.tree-btn{flex:1;min-width:0;border:0;background:transparent;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:7px;padding:5px 8px 5px 0;color:#9CA3AF;
  font-family:'Pretendard',-apple-system,sans-serif;font-size:11.5px;font-weight:500}
.tree-item:hover .tree-btn,.tree-item.active .tree-btn{color:#FFFFFF}
.tree-btn .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.tree-btn .bar{width:3px;height:12px;border-radius:1px;flex:0 0 auto}
.tree-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-val{font-size:9.5px;font-variant-numeric:tabular-nums;color:#6B7280;font-weight:600;
  flex:0 0 auto;padding-left:4px}
.tree-item.active .tree-val{color:#A1B8FF}
.tree-item.is-input .tree-name{color:#7C91FD;/* primary.400 */}
.sidebar-foot{padding:10px 16px 14px;border-top:1px solid #2A2A2F}
.sidebar-foot b{display:block;font-size:9.5px;color:#9CA3AF;font-weight:600}
.sidebar-foot p{font-size:9px;color:#4B5563;margin-top:2px}

/* ---------- Main / topbar ---------- */
.main{min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:52px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 18px;
  background:#FFFFFF;/* light.bg */border-bottom:1px solid #E5E5E8;/* light.border */}
.crumb{min-width:0}
.crumb small{display:block;font-size:8.5px;color:#9CA3AF;text-transform:uppercase;
  letter-spacing:.08em;font-weight:600}
.crumb strong{display:block;font-size:13px;color:#0F0F12;font-weight:600;
  font-family:'Outfit',system-ui,sans-serif;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.top-spacer{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid #E5E5E8;background:#FFFFFF;
  border-radius:5px;padding:6px 9px;cursor:pointer;color:#4B5563;/* text.light.body */
  font-size:10.5px;font-weight:600;font-family:'Pretendard',sans-serif;white-space:nowrap}
.tb-btn:hover{background:#F8F8FA;/* light.surface */color:#0F0F12}
.tb-btn.accent{border-color:#5D68F7;color:#3332D0;/* primary.700 */background:#EDF3FF/* primary.50 */}
.tb-btn.accent:hover{background:#DFE8FF/* primary.100 */}
.tb-btn.on{background:#5D68F7;border-color:#5D68F7;color:#FFFFFF}
.tb-sep{width:1px;height:18px;background:#E5E5E8;flex:0 0 auto}

/* ---------- Stage: canvas view + doc view ---------- */
.stage{flex:1;min-height:0;display:flex}
.stage-main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
#treePanel{flex:1;position:relative;min-width:0;min-height:0;overflow:hidden;background:#F8F8FA}
#treePanel.hidden{display:none}
canvas#c{display:block;width:100%;height:100%}
#docView{flex:1;min-height:0;overflow-y:auto;background:#F8F8FA;padding:22px 26px 60px;display:none}
#docView.show{display:block}

/* canvas 오버레이 HUD */
.hud{position:absolute;z-index:20;background:#FFFFFF;border:1px solid #E5E5E8;border-radius:6px;
  padding:6px 10px;font-size:10.5px;color:#4B5563;box-shadow:0 2px 8px rgba(15,15,18,.06);
  user-select:none}
.hud.canvas-bar{top:12px;left:12px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;
  max-width:calc(100% - 24px)}
.hud.canvas-bar button{height:24px;border:1px solid #E5E5E8;border-radius:4px;background:#FFFFFF;
  cursor:pointer;font-size:10.5px;color:#4B5563;padding:0 8px;font-family:'Pretendard',sans-serif;
  line-height:22px;white-space:nowrap;font-weight:500}
.hud.canvas-bar button:hover{background:#F8F8FA;color:#0F0F12}
.hud.canvas-bar .sep{width:1px;height:16px;background:#E5E5E8;flex:0 0 auto}
#zoom-label{min-width:32px;text-align:center;font-variant-numeric:tabular-nums;flex:0 0 auto}
.legend{bottom:12px;left:12px;font-size:9.5px;line-height:1.7}
.legend span.sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:middle;
  margin-right:3px}
.hint{bottom:12px;right:12px;font-size:9.5px;color:#9CA3AF;text-align:right;line-height:1.6}

/* ---------- Doc pages ---------- */
.page{max-width:1240px;margin:0 auto}
.page-head{margin-bottom:16px}
.eyebrow{color:#6B7280;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  margin-bottom:6px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.eyebrow.caps{text-transform:uppercase;letter-spacing:.1em}
.eyebrow a{color:#3332D0;text-decoration:none;cursor:pointer}
.eyebrow a:hover{text-decoration:underline}
.page h1{font-family:'Outfit',system-ui,sans-serif;font-size:22px;line-height:1.25;margin:0 0 5px;
  letter-spacing:-.03em;font-weight:600;color:#0F0F12}
.page-desc{margin:0;color:#4B5563;font-size:11.5px;line-height:1.6;max-width:880px}
.badge-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:3px 7px;
  font-size:9px;font-weight:700;border:1px solid transparent;letter-spacing:.01em}
.badge.calc{background:#EDF3FF;color:#1E2185;border-color:#C5D5FF}     /* primary.50/900/200 */
.badge.input{background:#EDF3FF;color:#3332D0;border-color:#A1B8FF}
.badge.unit{background:#F9FAFB;color:#4B5563;border-color:#E5E7EB}     /* neutral.50/600/200 */
.badge.hist{background:#F3F4F6;color:#374151;border-color:#D1D5DB}
.badge.warn{background:#F9FAFB;color:#374151;border-color:#D1D5DB}
.badge.err{background:#FFFFFF;color:#DC2626;border-color:#DC2626}      /* semantic.negative */
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.formula-chip{display:inline-block;padding:3px 7px;border-radius:4px;background:#F8F8FA;
  border:1px solid #E5E5E8;color:#4B5563;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}

.grid{display:grid;gap:12px}
.grid.kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.grid.two{grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);margin-bottom:12px;align-items:start}
.grid.equal{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:12px}
.card{background:#FFFFFF;border:1px solid #E5E5E8;border-radius:8px;min-width:0}
.card.pad{padding:16px}
.kpi-card{padding:14px 15px;background:#FFFFFF;border:1px solid #E5E5E8;border-radius:8px}
.kpi-label{font-size:9.5px;color:#6B7280;font-weight:700;margin-bottom:7px;letter-spacing:.02em}
.kpi-value{font-family:'Outfit',system-ui,sans-serif;font-size:22px;line-height:1;font-weight:600;
  letter-spacing:-.035em;color:#0F0F12}
.kpi-value small{font-size:10px;color:#6B7280;margin-left:3px;font-weight:600;
  font-family:'Pretendard',sans-serif}
.kpi-sub{font-size:9px;color:#9CA3AF;margin-top:7px;line-height:1.45}
.kpi-sub .pos{color:#22C55E;font-weight:700}   /* semantic.positive */
.kpi-sub .neg{color:#DC2626;font-weight:700}   /* semantic.negative */

.section-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;
  border-bottom:1px solid #F3F4F6}
.section-head h2{font-family:'Outfit',system-ui,sans-serif;font-size:12.5px;margin:0;font-weight:600;
  letter-spacing:-.01em;color:#0F0F12}
.section-head p{font-size:9.5px;color:#6B7280;margin:3px 0 0;line-height:1.5}
.section-head .unit{margin-left:auto;font-size:9px;color:#9CA3AF;white-space:nowrap;padding-top:2px}
.card-body{padding:14px 16px}

.table-wrap{overflow:auto}
.table-wrap::-webkit-scrollbar{height:8px;width:8px}
.table-wrap::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:4px}
table.fm{width:100%;border-collapse:separate;border-spacing:0}
table.fm th,table.fm td{padding:7px 9px;border-bottom:1px solid #F3F4F6;white-space:nowrap}
/* 행 배경은 전부 background-color로만 지정한다.
   background 단축 속성을 쓰면 아래 .hist 오버레이(background-image)가 리셋되어
   실적 구간 음영이 행 종류에 따라 들쭉날쭉하게 보인다. */
table.fm th{background-color:#F9FAFB;color:#6B7280;font-size:9px;font-weight:700;text-align:right;
  position:sticky;top:0;z-index:1;letter-spacing:.02em}
table.fm th:first-child,table.fm td:first-child{text-align:left;position:sticky;left:0;z-index:2;
  background-color:inherit}
table.fm th:first-child{background-color:#F9FAFB}
table.fm td{font-size:10.5px;text-align:right;font-variant-numeric:tabular-nums;color:#374151;
  background-color:#FFFFFF}
table.fm td:first-child{font-weight:600;color:#0F0F12}
table.fm tr:last-child td{border-bottom:0}
table.fm tr.total td{font-weight:700;background-color:#EDF3FF;color:#1E2185}
table.fm tr.total td:first-child{background-color:#EDF3FF}
table.fm tr.sub td{background-color:#F8F8FA}
table.fm tr.sub td:first-child{background-color:#F8F8FA}
table.fm tr.drv td{background-color:#FFFFFF;color:#4B5563}
table.fm tr:hover td{background-color:#F8F8FA}
table.fm tr:hover td:first-child{background-color:#F8F8FA}
/* 실적 구간 음영 — 행 배경색을 덮어쓰지 않고 그 위에 균일하게 얹는다 */
table.fm th.hist,table.fm td.hist{background-image:linear-gradient(rgba(17,24,39,.05),rgba(17,24,39,.05))}
table.fm tr:hover td.hist{background-image:linear-gradient(rgba(17,24,39,.09),rgba(17,24,39,.09))}
.cellrow{display:flex;align-items:center;gap:6px}
.cellrow .lvl{display:inline-block;flex:0 0 auto}
.rowlink{border:0;background:transparent;padding:0;cursor:pointer;color:inherit;font:inherit;
  text-align:left;text-decoration:none}
.rowlink:hover{color:#3332D0;text-decoration:underline}
.neg{color:#DC2626}
.pos{color:#22C55E}
.mark-input{width:6px;height:6px;border-radius:50%;background:#5D68F7;flex:0 0 auto}
.footnote{font-size:9px;color:#9CA3AF;line-height:1.6;margin-top:9px}

/* 기여도 막대 */
.contrib{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.contrib-bar{width:56px;height:5px;border-radius:3px;background:#F3F4F6;overflow:hidden;flex:0 0 auto}
.contrib-bar i{display:block;height:100%;border-radius:3px}

/* SVG 차트 */
.chart-box{padding:6px 4px 0}
svg.fmchart{display:block;width:100%;height:auto;overflow:visible}
.ax-line{stroke:#E5E5E8;stroke-width:1}
.grid-line{stroke:#F3F4F6;stroke-width:1}
.ax-text{fill:#9CA3AF;font:9px 'Pretendard',sans-serif}
.val-text{fill:#4B5563;font:9px 'Pretendard',sans-serif;font-variant-numeric:tabular-nums}
.legend-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.legend-item{font-size:9.5px;color:#4B5563;display:flex;align-items:center;gap:5px}
.legend-dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}

/* 투자심사 뷰 */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#FFFFFF;border:1px solid #E5E5E8;border-radius:10px;padding:14px 16px}
.kpi .k{font-size:11px;color:#6B7280;letter-spacing:.04em;margin-bottom:6px}
.kpi .v{font-size:22px;font-weight:700;color:#0F0F12;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:#9CA3AF;margin-top:4px}
.kpi.pos .v{color:#1E7A48}
.kpi.neg .v{color:#DC2626}
td.pos{color:#1E7A48;font-weight:600}
td.neg{color:#DC2626;font-weight:600}
table.fm tr.hl td{background:#EDF3FF;font-weight:700}
p.lead{font-size:14px;color:#374151;line-height:1.7;margin:0 0 10px}
ul.memo{margin:0;padding-left:18px}
ul.memo li{font-size:13px;color:#4B5563;line-height:1.75;margin-bottom:6px}

/* 투자 아이디어 카드 */
.idea{border:1px solid #E5E5E8;border-radius:10px;background:#FFFFFF;margin-bottom:12px;overflow:hidden}
.idea-head{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;
  border-bottom:1px solid #F3F4F6;background:#F9FAFB}
.idea-n{width:22px;height:22px;border-radius:6px;background:#1E2185;color:#FFFFFF;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.idea-title{font-size:13px;font-weight:700;color:#0F0F12;margin:0;line-height:1.45}
.idea-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:9.5px;color:#4B5563;background:#F3F4F6;border-radius:999px;padding:2px 8px;font-weight:700}
.tag.hi{background:#EDF3FF;color:#1E2185}
.idea-body{padding:13px 15px}
.idea-body p{font-size:12.5px;color:#374151;line-height:1.75;margin:0 0 12px}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.idea-box .h{font-size:9.5px;font-weight:700;letter-spacing:.04em;color:#6B7280;margin-bottom:5px}
.idea-box ul{margin:0;padding-left:15px}
.idea-box li{font-size:11.5px;color:#4B5563;line-height:1.65;margin-bottom:5px;
  padding-left:12px;position:relative;list-style:none}
.idea-box li:before{content:'▪';position:absolute;left:0;top:-1px;color:#A1B8FF;font-size:9px}
.idea-box ul.sub > li{font-size:11px;color:#6B7280;padding-left:11px;margin-bottom:2px}
.idea-box ul.sub > li:before{content:'–';color:#9CA3AF;font-size:11px;top:0}
.falsify{margin-top:14px;padding:10px 12px;border-radius:6px;background:#F9FAFB;
  border:1px solid #E5E7EB;border-left:3px solid #DC2626;font-size:11.5px;color:#4B5563;line-height:1.7}
.falsify b{color:#DC2626}

/* 토네이도 막대 — 좌우 대칭으로 한 행에 음/양을 함께 둔다 */
.tor{display:flex;align-items:center;gap:2px;min-width:180px}
.tor-l,.tor-r{flex:1;display:flex;height:11px}
.tor-l{justify-content:flex-end}
.tor-l span{background:#9CA3AF;border-radius:2px 0 0 2px;display:block;height:100%}
.tor-r span{background:#5D68F7;border-radius:0 2px 2px 0;display:block;height:100%}

/* 아이디어의 최신 진행 상황 — 논거보다 먼저 눈에 들어와야 한다 */
.idea-upd{margin:0 0 12px;padding:10px 12px;border-radius:6px;background:#EDF3FF;
  border:1px solid #C5D5FF;border-left:3px solid #1E2185;font-size:11.5px;
  color:#1E2185;line-height:1.7}
.idea-upd b{color:#1E2185}

/* 애널리스트 리포트 */
.rp{max-width:960px;margin:0 auto}
.rp-cover{border:1px solid #E5E5E8;border-radius:10px;background:#FFFFFF;padding:20px 22px}
.rp-cover .co{font-family:'Outfit',system-ui,sans-serif;font-size:22px;font-weight:600;
  letter-spacing:-.03em;color:#0F0F12}
.rp-cover .sub{font-size:10.5px;color:#6B7280;margin-top:5px;line-height:1.6}
.rp-sec{margin-top:26px}
.rp-num{font-size:9.5px;font-weight:700;color:#5D68F7;letter-spacing:.12em}
.rp-sec > h2{font-family:'Outfit',system-ui,sans-serif;font-size:15px;font-weight:600;
  margin:3px 0 3px;color:#0F0F12;letter-spacing:-.02em}
.rp-sec > p.desc{font-size:10.5px;color:#6B7280;margin:0 0 11px;line-height:1.6}
.rp-sec .card{margin-bottom:12px}
.rp-sec .card:last-child{margin-bottom:0}

/* 차트 — viewBox만 주고 폭은 여기서 잡는다. 인쇄·모바일에서 같이 줄어든다. */
.icv{width:100%;height:auto;display:block}
.chart-box{padding:2px 0}

/* 강조 — 본문에서 결론에 해당하는 조각 하나만 굵게 */
.hl-b{color:#0F0F12;font-weight:700}
ul.memo ul.sub > li .hl-b{color:#374151}

/* 타이포 위계 — 섹션 제목 > 카드 제목 > 본문 > 근거 */
.rp-sec > h2{font-size:17px;letter-spacing:-.03em;color:#0F0F12}
.rp-num{font-size:10px;letter-spacing:.14em}
.rp .section-head h2{font-size:13.5px}
.rp .section-head p{font-size:10px}
.rp p.lead{font-size:13px;color:#1F2937;line-height:1.75;margin-bottom:12px}
.rp ul.memo > li{font-size:12.5px}
.rp ul.memo ul.sub > li{font-size:11.5px}
table.fm td.q{font-weight:700;color:#0F0F12}

/* 인쇄 — 리포트 뷰를 그대로 종이/PDF로 넘긴다. 셸은 전부 걷어낸다. */
@media print{
  .sidebar,#scrim,.topbar,#treePanel,.rp-print,.modal,.legend{display:none !important}
  .app,.main,.stage,.stage-main{display:block !important;height:auto !important;overflow:visible !important}
  #docView{display:block !important;overflow:visible !important;height:auto !important;
    padding:0 !important;background:#FFFFFF !important}
  .rp{max-width:none}
  .card,.idea,.rp-sec{break-inside:avoid;page-break-inside:avoid}
  .kpi-row{break-inside:avoid}
  table.fm th{position:static !important}
  table.fm th:first-child,table.fm td:first-child{position:static !important}
  .table-wrap{overflow:visible !important}
  a[href]:after{content:''}
  @page{margin:14mm}
}
/* 본문은 문단이 아니라 항목이다. 층을 기호로 구분한다. */
ul.memo,ul.idea-ul{list-style:none;padding-left:0;margin:0}
ul.memo > li{font-size:12.5px;color:#4B5563;line-height:1.7;margin-bottom:9px;
  padding-left:15px;position:relative}
ul.memo > li:before{content:'▪';position:absolute;left:0;top:-1px;color:#5D68F7;font-size:10px}
ul.memo > li > b,ul.idea-ul > li > b{color:#0F0F12;font-weight:700}
ul.memo ul.sub,ul.idea-ul ul.sub{list-style:none;padding-left:0;margin:5px 0 0}
ul.memo ul.sub > li{font-size:12px;color:#6B7280;line-height:1.65;margin-bottom:3px;
  padding-left:13px;position:relative}
ul.memo ul.sub > li:before{content:'–';position:absolute;left:0;color:#9CA3AF}

/* 근거 / 노트 */
.notice{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;margin-bottom:14px;
  border-radius:6px;border:1px solid #E5E5E8;background:#F8F8FA;color:#4B5563;font-size:10.5px;
  line-height:1.6}
.notice strong{color:#0F0F12}
.notice.err{border-color:#DC2626;background:#FFFFFF;color:#DC2626}
.notice.accent{border-color:#C5D5FF;background:#EDF3FF;color:#1E2185}
.notice-icon{width:18px;height:18px;display:grid;place-items:center;flex:0 0 auto}
.callout-list{display:grid;gap:8px}
.callout{border:1px solid #E5E5E8;border-radius:6px;padding:10px 11px;background:#F8F8FA}
.callout b{display:block;font-size:10px;margin-bottom:3px;color:#0F0F12}
.callout p{font-size:9.5px;color:#4B5563;margin:0;line-height:1.55}

/* 입력 노드 편집 그리드 */
.inp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.inp-cell{border:1px solid #E5E5E8;border-radius:6px;padding:8px 9px;background:#FFFFFF}
.inp-cell.hist{background:#F3F4F6}
.inp-cell label{display:block;font-size:9px;color:#6B7280;font-weight:700;margin-bottom:5px}
.inp-cell input{width:100%;border:1px solid #E5E5E8;border-radius:4px;padding:5px 6px;font-size:11px;
  font-family:'Pretendard',sans-serif;font-variant-numeric:tabular-nums;color:#0F0F12;
  background:#FFFFFF;outline:none;text-align:right}
.inp-cell input:focus{border-color:#5D68F7}
.inp-cell.changed input{border-color:#5D68F7;background:#EDF3FF}

/* 상태 점 */
.dot-ok{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block}
.dot-err{width:7px;height:7px;border-radius:50%;background:#DC2626;display:inline-block}
.dot-neutral{width:7px;height:7px;border-radius:50%;background:#9CA3AF;display:inline-block}

/* ☰ 는 좁은 화면에서만 의미가 있다. 표시 여부를 인라인 style이 아니라
   여기서 정한다 — 인라인으로 숨기면 미디어쿼리가 되살릴 수 없다. */
#menuBtn{display:none}
#scrim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.38);
  z-index:39;opacity:0;transition:opacity .25s}
#scrim.show{display:block;opacity:1}

@media (max-width:1100px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);
    transition:transform .25s;z-index:40;box-shadow:0 0 32px rgba(15,23,42,.18)}
  .sidebar.open{transform:none}
  .grid.two{grid-template-columns:minmax(0,1fr)}
  #menuBtn{display:inline-flex}
  /* 툴바 버튼이 화면 폭을 넘으면 줄바꿈 대신 가로로 밀어 본다 */
  .topbar{overflow-x:auto;scrollbar-width:none}
  .topbar::-webkit-scrollbar{display:none}
  .crumb{min-width:0}
  #docView{padding:16px 14px 60px}
  /* .notice는 flex라 좁은 폭에서 <b> 조각이 한 글자씩 접힌다.
     좌우 배치가 목적이었으니 좌우가 없으면 그냥 본문처럼 흘려보낸다. */
  .notice{display:block}
  .kpi-row{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
}

</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-logo" id="brandLogo"></div>
        <div style="min-width:0">
          <div class="brand-name" id="brandName"></div>
        </div>
      </div>
    </div>
    <div class="side-scroll" id="sideScroll"></div>
    <div class="sidebar-foot">
      <b id="footTitle"></b>
      <p id="footSub"></p>
    </div>
  </aside>
  <div id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="tb-btn" id="menuBtn" title="메뉴" aria-label="메뉴" aria-expanded="false">☰</button>
      <div class="crumb"><small id="crumbPath">Model</small><strong id="crumbTitle">전체 캔버스</strong></div>
      <div class="top-spacer"></div>
      <button class="tb-btn" id="btnPL" title="전체 P&amp;L 테이블"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> 테이블</button>
      <button class="tb-btn accent" id="simBtn" title="가정변수 시뮬레이터"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg> 시뮬레이터</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" id="btnXlsx" title="수식이 박힌 .xlsx 다운로드"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 엑셀</button>
      <button class="tb-btn" id="btnJson" title="IR JSON 내보내기"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> JSON</button>
      <button class="tb-btn" id="btnReset" title="초안으로 되돌리기"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
    </header>

    <div class="stage">
      <div class="stage-main">
        <!-- 전체 조망 캔버스 -->
        <div id="treePanel">
          <canvas id="c"></canvas>
          <div class="hud canvas-bar">
            <button onclick="zoomBtn(-1)" title="축소">−</button>
            <span id="zoom-label">100%</span>
            <button onclick="zoomBtn(1)" title="확대">+</button>
            <div class="sep"></div>
            <button onclick="toggleAll(true)">모두 펼치기</button>
            <button onclick="toggleAll(false)">모두 접기</button>
            <button onclick="fitAll()">전체 보기</button>
            <div class="sep"></div>
            <button onclick="showAssumptions()">가정변수</button>
            <button onclick="showRevTable()">테이블</button>
            <div class="sep"></div>
            <span id="selLabel" style="font-size:10px;color:#9CA3AF;font-weight:500">선택 없음</span>
            <button id="btnOpenPage" onclick="openSelectedPage()" disabled>계정 열기</button>
            <button id="btnAddChild" onclick="addUnderSelected()" disabled title="자식 노드로 분해">분해</button>
            <button id="btnEdit" onclick="editSelected()" disabled>편집</button>
            <button id="btnDelete" onclick="deleteSelected()" disabled style="color:#DC2626">삭제</button>
          </div>
          <div class="hud legend" id="canvasLegend"></div>
          <div class="hud hint">드래그 이동 · 스크롤 확대/축소<br>노드 클릭 펼침 · 막대 아이콘 연도별 수치 · 우클릭 편집</div>
        </div>
        <!-- 계정별 문서 뷰 -->
        <section id="docView"></section>
      </div>
      <div id="simPanel" style="width:0;overflow:hidden;transition:width .3s;border-left:1px solid #E5E5E8;background:#FFFFFF;display:flex;flex-direction:column;flex-shrink:0"></div>
    </div>
  </div>
</div>

<div class="popup-overlay" id="revTableOverlay" onclick="if(event.target===this)closeRevTable()" style="display:none;align-items:center;justify-content:center;background:rgba(15,15,18,0.25);position:fixed;top:0;left:0;right:0;height:100%;z-index:200">
  <div class="popup" style="padding:20px 24px;width:90vw;max-width:960px;max-height:90vh;overflow-y:auto">
    <button class="popup-close" onclick="closeRevTable()">✕</button>
    <h3>모델 전체 테이블</h3>
    <div class="psub" id="revTableSub">시뮬레이션 결과 기반</div>
    <div id="revTableBody"></div>
  </div>
</div>
<div class="popup-overlay" id="popupOverlay" onclick="if(event.target===this)closePopup()">
  <div class="popup" id="popup"><button class="popup-close" onclick="closePopup()">✕</button>
    <h3 id="popupTitle"></h3><div class="popup-sub" id="popupSub"></div><div id="popupBody"></div>
  </div>
</div>
<div class="popup-overlay" id="editOverlay" onclick="if(event.target===this)closeEdit()">
  <div class="popup" id="editPopup" style="min-width:480px;max-width:580px">
    <button class="popup-close" onclick="closeEdit()">✕</button>
    <h3 id="editTitle">노드 편집</h3>
    <div class="popup-sub" id="editSub"></div>
    <div class="edit-form" id="editBody"></div>
  </div>
</div>
<div class="ctx-menu" id="ctxMenu" style="display:none"></div>
<div class="popup-overlay" id="assumOverlay" onclick="if(event.target===this)closeAssum()" style="display:none">
  <div class="popup" id="assumPopup" style="min-width:760px;max-width:920px;max-height:90vh;overflow-y:auto;padding:24px 20px 20px">
    <button class="popup-close" onclick="closeAssum()">✕</button>
    <h3 style="margin-bottom:4px">탑라인 가정변수 일람</h3>
    <div style="font-size:11px;color:#9CA3AF;margin-bottom:16px">시나리오 분석 시 변경하는 핵심 입력값. 연도별 직접 입력.</div>
    <div id="assumBody"></div>

// ============================================================
// GRAPH — MODEL에서 파생되는 그래프 색인
//
// MODEL에는 엣지가 두 종류 들어 있다.
//   parent  → 집계 트리 (화면 구조: 무엇이 무엇에 속하는가)
//   formula → 계산 의존성 (값의 흐름: 무엇으로부터 계산되는가)
// 둘은 같지 않다. PREV()나 서브트리를 가로지르는 공유 드라이버가 끼면 갈라진다.
//
// 색인 전에는 childrenOf/rootId/depthOf/pathOf가 호출마다 MODEL 전체를 훑어
// 렌더가 O(n²)였다. 여기서 한 번 만들어두고 전부 조회로 바꾼다.
//
// 그리고 formula 엣지의 역방향(dependents)을 처음으로 갖게 된다.
// "이 값을 바꾸면 무엇이 흔들리는가"에 답할 수 있다는 뜻이다.
//
// 의존성 색인(deps/dependents/order)은 topoSort()에 의존하므로 지연 구축한다.
// rebuildIndexes()는 파일 상단에서도 불리는데, 그 시점엔 파서 쪽 선언이
// 아직 초기화되지 않았을 수 있다. rebuildIndexes() 뒤엔 항상 simCalc()이
// 따라오고 simCalc()이 graphDeps()를 부르므로 순서는 보장된다.
// ============================================================
function buildGraph(){
  let g={ children:{}, parent:{}, depth:{}, path:{}, root:null,
          deps:{}, dependents:{}, order:[], inputs:[], _depsReady:false };

  // ── 트리 엣지 (parent) ──
  // for..in 순서 = MODEL 정의 순서. 자식 배열 순서가 곧 화면 순서라 유지해야 한다.
  for(let k in MODEL){
    let p=MODEL[k].parent;
    if(p!=null && MODEL[p]){ g.parent[k]=p; (g.children[p]=g.children[p]||[]).push(k); }
    else { g.parent[k]=null; if(g.root==null) g.root=k; }
  }
  if(g.root==null) g.root=Object.keys(MODEL)[0]||null;

  // ── depth / path — 부모 체인을 따라 올라간다 (순환 방어 guard) ──
  for(let k in MODEL){
    let arr=[], cur=k, guard=0;
    while(MODEL[cur] && guard++<60){ arr.unshift(cur); cur=g.parent[cur]; }
    g.path[k]=arr; g.depth[k]=arr.length-1;
  }

  g.inputs=Object.keys(MODEL).filter(k=>MODEL[k].type==='input');
  return g;
}

// 의존성 색인 지연 구축 — topoSort()가 _ast/_deps를 채우고 순환을 검출한다.
function graphDeps(){
  if(!GRAPH) GRAPH=buildGraph();
  if(GRAPH._depsReady) return GRAPH;
  let g=GRAPH;
  g.order=topoSort();
  g.deps={}; g.dependents={};
  for(let k in MODEL){
    let list=[];
    if(MODEL[k]._deps) MODEL[k]._deps.forEach(x=>{ if(MODEL[x]) list.push(x); });
    if(MODEL[k]._lagged) MODEL[k]._lagged.forEach(x=>{
      if(MODEL[x] && list.indexOf(x)<0) list.push(x);
    });
    g.deps[k]=list;
    list.forEach(x=>{ (g.dependents[x]=g.dependents[x]||[]).push(k); });
  }
  g._depsReady=true;
  return g;
}

// ── 그래프 질의 ──────────────────────────────────────────────
// 상류: id를 계산하는 데 쓰이는 모든 노드 (formula 엣지 역추적)
function ancestorsOf(id){
  let g=graphDeps(), seen=new Set(), stack=[id];
  while(stack.length){
    let cur=stack.pop();
    (g.deps[cur]||[]).forEach(n=>{ if(!seen.has(n)){ seen.add(n); stack.push(n); } });
  }
  return [...seen];
}
// 하류: id를 (직접·간접으로) 참조하는 모든 노드
function descendantsOf(id){
  let g=graphDeps(), seen=new Set(), stack=[id];
  while(stack.length){
    let cur=stack.pop();
    (g.dependents[cur]||[]).forEach(n=>{ if(!seen.has(n)){ seen.add(n); stack.push(n); } });
  }
  return [...seen];
}
// id를 실제로 움직이는 가정변수. 트리 하위가 아니라 수식 의존성 기준이다.
function driversOf(id){
  return ancestorsOf(id).filter(k=>MODEL[k] && MODEL[k].type==='input');
}
// 어떤 계산에도 쓰이지 않는 가정변수 — 오타나 삭제 잔재
function unusedInputs(){
  let g=graphDeps();
  return g.inputs.filter(k=>!(g.dependents[k]||[]).length);
}
// 두 계정이 함께 물고 있는 가정변수 (매출-비용 교차 참조 §5.2)
function sharedDrivers(a,b){
  let A=new Set(driversOf(a));
  return driversOf(b).filter(k=>A.has(k));
}

// buildTree() — MODEL의 parent 필드를 따라 시각 트리 구성
function buildTree(){
  let childrenOf={};
  for(let k in MODEL){
    let p=MODEL[k].parent;
    if(p==null||!MODEL[p])continue;
    (childrenOf[p]=childrenOf[p]||[]).push(k);
  }
  function makeNode(id){
    let d=MODEL[id]; if(!d)return null;
    let kids=childrenOf[id]||[];
    let n={id, label:d.label, sub:d.sub, data:id};
    if(d.type==='input'){
      n.drv=1;
    } else {
      n.bg=d.bg; n.fg=d.fg; n.sfg=d.sfg; n.bdr=d.bdr;
    }
    if(kids.length) n.children=kids.map(makeNode).filter(x=>x);
    return n;
  }
  return makeNode('root');
}

// 공통 표기 규칙: %는 소수1자리 / |v|>=10 정수(반올림) / |v|<10 소수 최대2자리
function fmtSmart(v,pct){
  if(pct) return (v*100).toFixed(1)+'%';
  if(typeof v!=='number'||!isFinite(v)) return '-';
  if(Math.abs(v)>=10) return Math.round(v).toLocaleString('ko-KR');
  return (Math.round(v*100)/100).toLocaleString('ko-KR',{maximumFractionDigits:2});
}
// UNITS의 선택 필드는 쓰는 자리마다 기본값을 세운다.
// 초기화 블록 하나로 몰면 그 블록이 이름 없는 구문이라 하네스가 떼어가지 못하고,
// 브라우저에서는 되는데 Excel 빌드(G7)에서만 죽는 상태가 된다.
// 두 번째 종목 KT&G를 태우다 실제로 그 자리에서 걸렸다 — 엔진이 종목 데이터의
// 선택 필드에 의존하고 있었다는 뜻이다.
function _uList(x){ return Array.isArray(x) ? x : []; }

// 통화 노드인가? UNITS.money와 정확히 같은 단위만 축약 대상으로 본다.
function isMoney(u){ return !!u && u===UNITS.money; }
// 큰 통화값 축약. UNITS.moneyAbbrev가 비어 있으면 그냥 fmtSmart로 떨어진다.
function fmtMoney(v){
  if(typeof v!=='number'||!isFinite(v)) return '-';
  let a=Math.abs(v), s=v<0?'-':'';
  let _ab=_uList(UNITS.moneyAbbrev);
  for(let i=0;i<_ab.length;i++){
    let r=_ab[i];
    if(a>=r.min) return s+(a/r.div).toFixed(r.digits)+r.suffix;
  }
  return fmtSmart(v);
}
function fmtNum(v,u,pct){
  if(pct) return (v*100).toFixed(1)+'%';
  if(isMoney(u)) return fmtMoney(v);
  return fmtSmart(v,pct);
}

let bridgeSelection = []; // stores [yearIdx1, yearIdx2] or [yearIdx1]

function toggleBridgeInline(body,parentSec,yearIdx,barEl){
  bridgeBody = body;
  bridgeParentSec = parentSec;

  let idx = bridgeSelection.indexOf(yearIdx);
  if(idx !== -1){
    // Deselect
    bridgeSelection.splice(idx, 1);
  } else {
    if(bridgeSelection.length === 0){
      bridgeSelection.push(yearIdx);
    } else if(bridgeSelection.length === 1){
      bridgeSelection.push(yearIdx);
      bridgeSelection.sort((a,b)=>a-b);
    } else {
      // Already 2 selected, replace: keep the other one closest, or just reset
      bridgeSelection = [yearIdx];
    }
  }

  // Update bar highlights
  parentSec.querySelectorAll('.chart-bar-wrap').forEach((w,i)=>{
    if(bridgeSelection.includes(i)){
      w.style.outline='2px solid #374151';
      w.style.outlineOffset='2px';
      w.style.borderRadius='4px';
    } else {
      w.style.outline='none';
    }
  });

  // Remove existing bridge
  let existing = document.getElementById('inlineBridge');
  if(existing) existing.remove();

  if(bridgeSelection.length === 0) return;

  let fi, ti;
  if(bridgeSelection.length === 1){
    fi = bridgeSelection[0];
    ti = fi + 1;
    if(ti > 6) { ti = 6; fi = 5; }
  } else {
    fi = bridgeSelection[0];
    ti = bridgeSelection[1];
  }

  renderBridge(fi, ti, parentSec);
}

function renderBridge(fi, ti, parentSec){
  // ============================================================
  // 브릿지(워터폴) 데이터 — root의 직계 자식에서 자동 구성.
  // 예전에는 세그먼트를 이 자리에 하드코딩해서, 그 id가 없는 모델에서는
  // renderBridge가 그대로 터졌다. 이제 MODEL 구조를 따라간다.
  // 색은 nodeColor()가 형제 순서로 배정한다 (DS 토큰 램프).
  // ============================================================
  const _r=rootId();
  const BMS={};
  childrenOf(_r).forEach(k=>{
    BMS[MODEL[k].label||k]={v:(MODEL[k].v||[]).slice(), c:nodeColor(k)};
  });
  const TOT=(MODEL[_r].v||[]).slice();
  const bnames=Object.keys(BMS);
  const bfmt=v=>fmtMoney(v);

  let fromTotal=TOT[fi], toTotal=TOT[ti];
  let deltas=bnames.map(n=>BMS[n].v[ti]-BMS[n].v[fi]);
  let totalDelta=toTotal-fromTotal;

  let bridge=document.createElement('div');
  bridge.id='inlineBridge';
  bridge.style.cssText='margin:16px 0 8px;padding:16px;background:var(--color-background-secondary,#F9FAFB);border-radius:8px;border:0.5px solid var(--color-border-tertiary,#E5E5E8)';

  let title=document.createElement('div');
  title.style.cssText='font-size:12px;font-weight:600;color:var(--color-text-primary,#374151);margin-bottom:12px';
  let _rootLabel=(MODEL[rootId()]||{}).label||'합계';
  title.textContent=YRS[fi]+'년 → '+YRS[ti]+'년 '+_rootLabel+' 브릿지  ('+(totalDelta>=0?'+':'')+bfmt(totalDelta)+')';
  bridge.appendChild(title);

  // Canvas
  let canvasWrap=document.createElement('div');
  canvasWrap.style.cssText='position:relative;width:100%;height:260px';
  let cvs=document.createElement('canvas');
  canvasWrap.appendChild(cvs);
  bridge.appendChild(canvasWrap);

  // Table
  let tbl=document.createElement('table');

// ============ INTERACTION ============
function s2w(sx,sy){let r=cvs.getBoundingClientRect();return{x:(sx-r.left-cam.x)/cam.s,y:(sy-r.top-cam.y)/cam.s}}
function hitTest(sx,sy){let w=s2w(sx,sy);for(let i=allNodes.length-1;i>=0;i--){let n=allNodes[i],p=getPos(n.id);if(!p)continue;if(w.x>=p.x&&w.x<=p.x+p.w&&w.y>=p.y&&w.y<=p.y+p.h){let inChart=n.data&&MODEL[n.data]&&w.x>=p.x+p.w-ICON_W&&w.y<=p.y+24;return{node:n,isChart:inChart}}}return null}
function canToggle(n){return n.children&&n.children.length>0}
let drag=false,dragStart={x:0,y:0},camStart={x:0,y:0},clickStart=null;
let nodeDrag=null; // {nodeId, startX, startY}
let nodeOffsets={}; // {nodeId: {dx, dy}}
cvs=document.getElementById('c');ctx=cvs.getContext('2d');
function resize(){let _tp=document.getElementById("treePanel");let _w=_tp?_tp.clientWidth:window.innerWidth,_h=_tp?_tp.clientHeight:window.innerHeight;if(_w<2||_h<2)return;W=_w;H=_h;cvs.width=W*dpr;cvs.height=H*dpr;cvs.style.width=W+'px';cvs.style.height=H+'px';renderAll()}
window.addEventListener('resize',resize);
cvs.addEventListener('pointerdown',e=>{
  clickStart={x:e.clientX,y:e.clientY,t:Date.now()};
  cvs.setPointerCapture(e.pointerId);
  let hit=hitTest(e.clientX,e.clientY);
  if(hit&&!hit.isChart){
    // Potential node drag - don't start yet, wait for movement threshold
    let w=s2w(e.clientX,e.clientY);
    let p=getPos(hit.node.id);
    nodeDrag={id:hit.node.id,ox:w.x-p.x,oy:w.y-p.y,active:false};
    drag=false;
  } else {
    nodeDrag=null;
    drag=true;dragStart={x:e.clientX,y:e.clientY};camStart={x:cam.x,y:cam.y};
  }
});
cvs.addEventListener('pointermove',e=>{
  if(nodeDrag){
    let dist=Math.abs(e.clientX-clickStart.x)+Math.abs(e.clientY-clickStart.y);
    if(!nodeDrag.active&&dist<8)return; // threshold not met, wait
    nodeDrag.active=true; // now it's a real drag
    cvs.style.cursor='grabbing';
    let w=s2w(e.clientX,e.clientY);
    let baseP=positions[nodeDrag.id];
    if(baseP){
      // Only update THIS node's offset. Children inherit via getPos ancestor chain.
      // But we need to account for ancestor offsets when computing the target
      let ancestorDx=0,ancestorDy=0,cur=parentMap[nodeDrag.id];
      while(cur){let o=nodeOffsets[cur];if(o){ancestorDx+=o.dx;ancestorDy+=o.dy}cur=parentMap[cur]}
      if(!nodeOffsets[nodeDrag.id])nodeOffsets[nodeDrag.id]={dx:0,dy:0};
      nodeOffsets[nodeDrag.id].dx=w.x-nodeDrag.ox-baseP.x-ancestorDx;
      nodeOffsets[nodeDrag.id].dy=w.y-nodeDrag.oy-baseP.y-ancestorDy;
      renderAll();
    }
    return;
  }
  if(drag){cam.x=camStart.x+(e.clientX-dragStart.x);cam.y=camStart.y+(e.clientY-dragStart.y);renderAll()}
  let hit=hitTest(e.clientX,e.clientY);
  let nh=hit?hit.node.id:null;let nc=hit&&hit.isChart?hit.node.id:null;
  if(nh!==hoverId||nc!==hoverChart){hoverId=nh;hoverChart=nc;cvs.style.cursor=nc?'pointer':(nh?'grab':'default');renderAll()}
});
cvs.addEventListener('pointerup',e=>{
  drag=false;
  if(clickStart&&Math.abs(e.clientX-clickStart.x)<5&&Math.abs(e.clientY-clickStart.y)<5&&Date.now()-clickStart.t<300){
    let hit=hitTest(e.clientX,e.clientY);
    if(hit){
      if(hit.isChart){
        showChart(hit.node);
      } else {
        // 노드 본문 클릭 → 선택 + 펼침/접힘
        selectedId=hit.node.id;
        updateSelectedToolbar();
        if(canToggle(hit.node)){
          if(openSet.has(hit.node.id)) openSet.delete(hit.node.id);
          else openSet.add(hit.node.id);
        }
        renderAll();
      }
    } else {
      // 빈 영역 클릭 → 선택 해제
      selectedId=null;
      updateSelectedToolbar();
      renderAll();
    }
  }
  clickStart=null;
});
cvs.addEventListener('wheel',e=>{e.preventDefault();let f=e.deltaY<0?1.08:1/1.08;let ns=Math.max(0.15,Math.min(4,cam.s*f));let _r=cvs.getBoundingClientRect();let _mx=e.clientX-_r.left,_my=e.clientY-_r.top;let wx=(_mx-cam.x)/cam.s,wy=(_my-cam.y)/cam.s;cam.s=ns;cam.x=_mx-wx*cam.s;cam.y=_my-wy*cam.s;document.getElementById('zoom-label').textContent=Math.round(cam.s*100)+'%';renderAll()},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePopup();closeAssum();closeRevTable()}});
function zoomBtn(d){let ns=cam.s*(d>0?1.15:1/1.15);ns=Math.max(0.15,Math.min(4,ns));let cx=W/2,cy=H/2,wx=(cx-cam.x)/cam.s,wy=(cy-cam.y)/cam.s;cam.s=ns;cam.x=cx-wx*cam.s;cam.y=cy-wy*cam.s;document.getElementById('zoom-label').textContent=Math.round(cam.s*100)+'%';renderAll()}
function fitAll(){nodeOffsets={};allNodes=[];positions={};doLayout(TREE,PAD,PAD);let minX=1e9,minY=1e9,maxX=0,maxY=0;Object.values(positions).forEach(p=>{if(p.x<minX)minX=p.x;if(p.y<minY)minY=p.y;if(p.x+p.w>maxX)maxX=p.x+p.w;if(p.y+p.h>maxY)maxY=p.y+p.h});maxX+=40;maxY+=40;let tw=maxX-minX+PAD*2,th=maxY-minY+PAD*2;cam.s=Math.min(W/tw,H/th,2)*.9;cam.x=W/2-(minX+maxX)/2*cam.s;cam.y=H/2-(minY+maxY)/2*cam.s;document.getElementById('zoom-label').textContent=Math.round(cam.s*100)+'%';renderAll()}
function toggleAll(open){
  nodeOffsets={};
  // 접을 때도 루트와 그 직계는 남긴다. 빈 화면이 되지 않게.
  let keep=new Set([TREE.id].concat((TREE.children||[]).map(c=>c.id)));
  function walk(n){
    if(canToggle(n)){
      if(open) openSet.add(n.id);
      else if(!keep.has(n.id)) openSet.delete(n.id);
    }
    if(n.children) n.children.forEach(walk);
  }
  walk(TREE);
  if(!open) keep.forEach(id=>openSet.add(id));
  fitAll();
}

function showAssumptions(){
  // ========== 가정변수 일람 — MODEL에서 자동 생성 ==========
  // 입력 노드를 parent별로 그룹핑. note는 MODEL[k].desc 사용.
  let byParent={};
  for(let k of INPUT_KEYS){
    let d=MODEL[k]; if(!d) continue;
    let p=d.parent||'_orphan';
    (byParent[p]=byParent[p]||[]).push(k);
  }
  let _ord=[];
  function _walkA(id){
    let kids=Object.keys(MODEL).filter(k=>MODEL[k].parent===id);
    if(byParent[id]) _ord.push(id);
    kids.forEach(_walkA);
  }
  _walkA('root');
  if(byParent['_orphan']) _ord.push('_orphan');
  const sections=_ord.map(pid=>{
    let p=MODEL[pid]||{};
    return {
      title:(p.label||pid)+' — 드라이버',
      color:p.bg||p.c||'#5D68F7',
      items:byParent[pid].map(k=>({key:k, label:MODEL[k].label, note:descBody(MODEL[k].desc)}))
    };
  });

  let body=document.getElementById('assumBody');
  body.innerHTML='';
  const fullFmt=(v,pct)=>{
    if(typeof v!=='number')return'-';
    if(v===0)return'-';
    return fmtSmart(v,pct);
  };

  sections.forEach(sec=>{
    let div=document.createElement('div');
    div.style.cssText='margin-bottom:20px';
    let hdr=document.createElement('div');
    hdr.style.cssText='font-size:12px;font-weight:600;color:#374151;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid '+sec.color;
    hdr.textContent=sec.title;
    div.appendChild(hdr);

    let tbl=document.createElement('table');
    tbl.style.cssText='width:100%;border-collapse:collapse';
    let th=document.createElement('tr');
    th.innerHTML='<th style="text-align:left;font-size:10px;color:#9CA3AF;padding:4px 6px;font-weight:400;width:180px">변수</th><th style="text-align:center;font-size:10px;color:#9CA3AF;padding:4px 6px;font-weight:400;width:56px">설명</th>'+YRS.map((y,i)=>'<th style="text-align:right;font-size:10px;color:'+(_isFc(i)?'#3332D0':'#9CA3AF')+';padding:4px 6px;font-weight:'+(_isFc(i)?'600':'400')+';width:78px'+(_isFc(i)?';background:#EDF3FF':'')+'">'+y+'</th>').join('');
    tbl.appendChild(th);

    sec.items.forEach(item=>{
      let d=MODEL[item.key];
      if(!d)return;
      let tr=document.createElement('tr');
      tr.style.cssText='border-bottom:0.5px solid #F9FAFB';
      let pct=d.pct;
      let cells='<td style="font-size:11px;padding:5px 6px;color:#374151;font-weight:500">'+item.label+'</td>';
      cells+='<td style="padding:5px 6px;text-align:center"><button onclick="showVarDesc(\''+item.key+'\')" title="추정 근거·로직 보기" style="font-size:10px;color:#3332D0;background:#EDF3FF;border:1px solid #A1B8FF;border-radius:4px;padding:2px 7px;cursor:pointer;white-space:nowrap;font-family:Pretendard,sans-serif">ⓘ</button></td>';
      d.v.forEach((v,i)=>{
        cells+='<td style="text-align:right;font-size:11px;padding:5px 6px;color:#374151;font-weight:400;font-family:Pretendard,sans-serif'+(_isFc(i)?';background:#EDF3FF':'')+'">'+fullFmt(v,pct)+'</td>';
      });
      tr.innerHTML=cells;
      tbl.appendChild(tr);
    });
    div.appendChild(tbl);
    body.appendChild(div);
  });

  // Summary note
  let note=document.createElement('div');
  note.style.cssText='font-size:10px;color:#9CA3AF;margin-top:12px;padding:10px;background:#F9FAFB;border-radius:6px;line-height:1.6';
  let _nVars=0;sections.forEach(s=>_nVars+=s.items.length);
  note.innerHTML='<b style="color:#4B5563">총 '+_nVars+'개 가정변수</b> | 시나리오 분석 시 해당 변수 조정';
  body.appendChild(note);

  let _aEl=document.getElementById('assumOverlay');_aEl.style.right=(document.getElementById('simPanel').offsetWidth||0)+'px';_aEl.style.display='flex';
}

function applyLeafEdit(id){
  let d=MODEL[id]; if(!d) return;
  let label=document.getElementById('_e_label').value.trim();
  let type=document.getElementById('_e_type').value;
  let formula=document.getElementById('_e_formula').value.trim();
  let unit=document.getElementById('_e_unit').value.trim();
  let desc=document.getElementById('_e_desc').value.trim();
  if(!label){ _editErr('_e_err','표시명 필수'); return; }
  if(type==='computed'){
    if(!formula){ _editErr('_e_err','계산 노드는 수식 필요'); return; }
    try{ parseFormula(formula); } catch(e){ _editErr('_e_err',e.message); return; }
  }
  if(id==='root' && type!=='computed'){ _editErr('_e_err','루트는 computed 타입만 가능'); return; }
  d.label=label;
  d.type=type;
  d.formula=type==='computed'?formula:null;
  d.u=unit||'원';
  d.desc=desc;
  if(type==='input'){
    if(!SV[id]) SV[id]=(d.v||Array(YRS.length).fill(0)).slice();
    if(!DEFAULTS_S[id]) DEFAULTS_S[id]=SV[id].slice();
  }
  _afterEdit();
}

function applyDecompEdit(id){
  let d=MODEL[id]; if(!d) return;
  let label=document.getElementById('_e_label').value.trim();
  let formula=document.getElementById('_e_formula').value.trim();
  let unit=document.getElementById('_e_unit').value.trim();
  let desc=document.getElementById('_e_desc').value.trim();
  if(!label){ _editErr('_e_err','표시명 필수'); return; }
  if(!formula){ _editErr('_e_err','수식 필수'); return; }

  // 기존 자식 검증
  for(let c of _editExisting){
    if(!c.deleted && !c.label){ _editErr('_e_err','자식 "'+c.id+'" 표시명 필수'); return; }
  }
  // 새 자식 검증
  let rx=/^[a-zA-Z_][a-zA-Z_0-9]*$/;
  let allIds=new Set(Object.keys(MODEL));
  _editExisting.filter(c=>c.deleted).forEach(c=>allIds.delete(c.id));
  for(let i=0;i<_editNew.length;i++){
    let c=_editNew[i];
    if(!c.id){ _editErr('_e_err','새 자식 '+(i+1)+': ID 필수'); return; }
    if(!rx.test(c.id)){ _editErr('_e_err','새 자식 '+(i+1)+': ID 형식 오류 ('+c.id+')'); return; }
    if(allIds.has(c.id)){ _editErr('_e_err','이미 존재하는 ID: '+c.id); return; }
    if(!c.label){ _editErr('_e_err','새 자식 '+(i+1)+': 표시명 필수'); return; }
    allIds.add(c.id);
  }

  // 수식 검증
  let ast;
  try{ ast=parseFormula(formula); } catch(e){ _editErr('_e_err','수식: '+e.message); return; }
  let deps=extractDeps(ast);
  for(let dep of deps){
    if(!allIds.has(dep)){ _editErr('_e_err','미정의 변수 참조: '+dep); return; }
  }

  // 적용 — 기존 자식 업데이트
  for(let c of _editExisting){
    if(c.deleted){
      // cascade 삭제
      function _cascade(k){
        Object.keys(MODEL).filter(x=>MODEL[x].parent===k).forEach(_cascade);
        delete MODEL[k]; delete SV[k]; delete DEFAULTS_S[k];
      }
      _cascade(c.id);
    } else {
      let cd=MODEL[c.id];
      if(cd){ cd.label=c.label; cd.u=c.unit||'원'; }
    }
  }
  // 새 자식 생성 (모두 input)
  let palette=['#5D68F7','#7C91FD','#A1B8FF','#9CA3AF','#6B7280','#3332D0'];
  let existingKidCount=_editExisting.filter(c=>!c.deleted).length;
  _editNew.forEach((c,i)=>{
    let arr=Array(YRS.length).fill(c.val);
    MODEL[c.id]={label:c.label, parent:id, type:'input', v:arr, u:c.unit||'원', desc:'', c:palette[(existingKidCount+i)%palette.length]};
    SV[c.id]=arr.slice(); DEFAULTS_S[c.id]=arr.slice();
  });
  // 부모 업데이트
  d.label=label;
  d.formula=formula;
  d.sub=formula;
  d.u=unit||'원';
  d.desc=desc;
  d.type='computed';
  _afterEdit();
}

// 분해 모달 — 부모를 N개 자식과 자유 수식으로 정의
// 자식별 ID·라벨·단위·초기값 개별 설정. 자식 추가/제거 자유. 수식도 자유 입력.
let _decompChildren=[];

function _decompRender(){
  let wrap=document.getElementById('_a_children');
  if(!wrap) return;
  wrap.innerHTML='';
  _decompChildren.forEach((c,i)=>{
    let row=document.createElement('div');
    row.style.cssText='display:grid;grid-template-columns:110px 1fr 70px 90px 24px;gap:6px;align-items:center;padding:6px 8px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:5px;margin-bottom:6px';
    row.innerHTML=`
      <input type="text" placeholder="ID" value="${_esc(c.id)}" style="padding:5px 8px;font-size:12px;border:1px solid #E5E7EB;border-radius:3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace" oninput="_decompChildren[${i}].id=this.value.trim()">
      <input type="text" placeholder="표시명" value="${_esc(c.label)}" style="padding:5px 8px;font-size:12px;border:1px solid #E5E7EB;border-radius:3px" oninput="_decompChildren[${i}].label=this.value.trim()">
      <input type="text" placeholder="단위" value="${_esc(c.unit)}" style="padding:5px 8px;font-size:12px;border:1px solid #E5E7EB;border-radius:3px" oninput="_decompChildren[${i}].unit=this.value.trim()">
      <input type="text" placeholder="초기값" value="${c.val}" style="padding:5px 8px;font-size:12px;border:1px solid #E5E7EB;border-radius:3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace" oninput="_decompChildren[${i}].val=parseFloat(this.value)||0">
      <button type="button" onclick="_decompRemove(${i})" style="background:none;border:none;color:${_decompChildren.length>1?'#DC2626':'#D1D5DB'};cursor:${_decompChildren.length>1?'pointer':'not-allowed'};font-size:13px;padding:0" title="자식 제거" ${_decompChildren.length<=1?'disabled':''}>✕</button>
    `;
    wrap.appendChild(row);
  });
}
function _decompAdd(){ _decompChildren.push({id:'', label:'', unit:'원', val:0}); _decompRender(); }
function _decompRemove(i){ if(_decompChildren.length<=1) return; _decompChildren.splice(i,1); _decompRender(); }

function applyAddChild(parentId){
  let formula=document.getElementById('_a_formula').value.trim();
  if(!formula){ _editErr('_a_err','수식 필수'); return; }

  // 자식 유효성 검사
  let rx=/^[a-zA-Z_][a-zA-Z_0-9]*$/;
  if(_decompChildren.length<1){ _editErr('_a_err','자식이 최소 1개 필요'); return; }
  let seen=new Set();
  for(let i=0;i<_decompChildren.length;i++){
    let c=_decompChildren[i];
    if(!c.id){ _editErr('_a_err','자식 '+(i+1)+': ID 필수'); return; }
    if(!rx.test(c.id)){ _editErr('_a_err','자식 '+(i+1)+': ID 형식 오류 ('+c.id+')'); return; }
    if(MODEL[c.id]){ _editErr('_a_err','이미 존재하는 ID: '+c.id); return; }
    if(seen.has(c.id)){ _editErr('_a_err','중복 ID: '+c.id); return; }
    if(!c.label){ _editErr('_a_err','자식 '+(i+1)+': 표시명 필수'); return; }
    seen.add(c.id);
  }

  // 수식 검증 — syntax + 변수 참조 (새 자식 또는 기존 노드)
  let ast;
  try{ ast=parseFormula(formula); } catch(e){ _editErr('_a_err','수식 파싱: '+e.message); return; }
  let deps=extractDeps(ast);
  for(let dep of deps){
    if(!MODEL[dep] && !seen.has(dep)){
      _editErr('_a_err','미정의 변수 참조: '+dep+' (자식으로 추가하거나 오타 확인)');
      return;
    }
  }

  // 자식 생성 (모두 input)
  let palette=['#5D68F7','#7C91FD','#A1B8FF','#9CA3AF','#6B7280','#3332D0'];
  _decompChildren.forEach((c,i)=>{
    let arr=Array(YRS.length).fill(c.val);
    MODEL[c.id]={label:c.label, parent:parentId, type:'input', v:arr, u:c.unit||'원', desc:'', c:palette[i%palette.length]};
    SV[c.id]=arr.slice();
    DEFAULTS_S[c.id]=arr.slice();
  });

  // 부모를 computed로 전환
  let p=MODEL[parentId];
  p.type='computed';
  p.formula=formula;
  p.sub=formula;
  if(!p.bg){ p.bg='#F9FAFB'; p.fg='#374151'; p.sfg='#6B7280'; p.bdr='#D1D5DB'; }
  delete SV[parentId]; delete DEFAULTS_S[parentId];

  _afterEdit();
}

function deleteNodeUI(id){
  if(id==='root') return;
  hideCtxMenu();
  let kids=Object.keys(MODEL).filter(k=>MODEL[k].parent===id);
  let deps=[];
  for(let k in MODEL){
    let d=MODEL[k]; if(!d.formula) continue;
    try{ if(extractDeps(parseFormula(d.formula)).has(id)) deps.push(k); } catch(e){}
  }
  let msg='"'+(MODEL[id].label||id)+'" 삭제';
  if(kids.length) msg+='\n자식 '+kids.length+'개도 함께 삭제';
  if(deps.length) msg+='\n경고: '+deps.length+'개 노드가 이 변수를 참조 (수식 에러로 표시됨): '+deps.join(', ');
  msg+='\n\n계속하시겠습니까?';
  if(!confirm(msg)) return;
  function cascade(k){
    Object.keys(MODEL).filter(c=>MODEL[c].parent===k).forEach(cascade);
    delete MODEL[k]; delete SV[k]; delete DEFAULTS_S[k];
  }
  cascade(id);
  closeEdit();
  _afterEdit();
}

// localStorage 영속화 (편집 결과 자동 저장 / 페이지 재방문 시 복원)
// ============================================================
function _stableJson(v){
  if(Array.isArray(v)) return '['+v.map(_stableJson).join(',')+']';
  if(v&&typeof v==='object'){
    return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+_stableJson(v[k])).join(',')+'}';
  }
  return JSON.stringify(v);
}
function _hashString(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){
    h^=s.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return (h>>>0).toString(36);
}
function _storageSafeId(s){
  return String(s||'model').trim().toLowerCase().replace(/[^a-z0-9가-힣_-]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,120)||'model';
}
// 저장키는 META.modelId에서 나온다. 종목마다 달라야 서로 덮어쓰지 않는다.
const _MODEL_ID=_storageSafeId(META.modelId||document.title+'_'+location.pathname);
const _STORAGE_KEY='fm_model_state_'+_MODEL_ID;
let _DRAFT_MODEL=null, _DRAFT_DEFAULTS_S=null;  // 초안 스냅샷 (리셋용)
let _SOURCE_SIGNATURE=null;
let _saveTimer=null;

// MODEL 직렬화 (캐시 필드 제외)
function _serializeModel(){
  let out={};
  for(let k in MODEL){
    let d=MODEL[k];
    out[k]={
      label:d.label, sub:d.sub, parent:d.parent, type:d.type, formula:d.formula,
      v:d.v?d.v.slice():null, u:d.u, desc:d.desc, c:d.c, pct:d.pct,
      bg:d.bg, fg:d.fg, sfg:d.sfg, bdr:d.bdr, point:d.point,
    };
  }
  return out;
}

function snapshotDraft(){
  _DRAFT_MODEL=_serializeModel();
  _DRAFT_DEFAULTS_S={};
  for(let k in DEFAULTS_S) _DRAFT_DEFAULTS_S[k]=DEFAULTS_S[k].slice();
  _SOURCE_SIGNATURE=_hashString(_stableJson({MODEL:_DRAFT_MODEL,DEFAULTS_S:_DRAFT_DEFAULTS_S,YRS:YRS}));
}

function saveToStorage(){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(_doSave, 300);
}

function _doSave(){
  try{
    let svObj={};
    for(let k in SV) svObj[k]=SV[k].slice();
    let defObj={};
    for(let k in DEFAULTS_S) defObj[k]=DEFAULTS_S[k].slice();
    let payload={version:2, modelId:_MODEL_ID, sourceSignature:_SOURCE_SIGNATURE, MODEL:_serializeModel(), SV:svObj, DEFAULTS_S:defObj};
    localStorage.setItem(_STORAGE_KEY, JSON.stringify(payload));
  } catch(e){ console.warn('Storage save 실패:',e); }
}

function loadFromStorage(){
  try{
    let s=localStorage.getItem(_STORAGE_KEY);
    if(!s) return false;
    let p=JSON.parse(s);
    if(!p || p.version!==2 || p.modelId!==_MODEL_ID || p.sourceSignature!==_SOURCE_SIGNATURE || !p.MODEL) return false;
    // MODEL 교체
    for(let k in MODEL) delete MODEL[k];
    Object.assign(MODEL, p.MODEL);
    // SV / DEFAULTS_S 교체
    if(p.SV){ for(let k in SV) delete SV[k]; Object.assign(SV, p.SV); }
    if(p.DEFAULTS_S){ for(let k in DEFAULTS_S) delete DEFAULTS_S[k]; Object.assign(DEFAULTS_S, p.DEFAULTS_S); }
    return true;
  } catch(e){ console.warn('Storage load 실패:',e); return false; }
}

// ============================================================
// SIMULATION ENGINE + SIDE PANEL
// ============================================================
// ============================================================
// DEFAULTS_S — 입력 변수의 기본값
// SV (현재 슬라이더 상태)와 비교 기준. 슬라이더의 주황색 마크 위치.
// "기본값" 버튼은 SV ← DEFAULTS_S 복사.
//
// MODEL에서 자동 파생한다 — 입력 노드의 v가 곧 초안값이다.
// 같은 숫자를 두 곳에 적지 않으므로 둘이 갈라질 수 없다.
// 노드 편집·삭제는 런타임에 이 객체를 직접 갱신한다.
// ============================================================
const DEFAULTS_S=Object.fromEntries(
  Object.keys(MODEL)
    .filter(k=>MODEL[k].type==='input')
    .map(k=>[k,(MODEL[k].v||[]).slice()])
);

let SV={},SR={};for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();

// ============================================================
// 수식 엔진 (Full 모드 — 동적 노드 편집)
//
// 흐름:
//   1) MODEL[k].formula 문자열 → tokenize → parse → AST (캐시)
//   2) AST에서 의존 변수 추출 (캐시)
//   3) 토폴로지 정렬로 평가 순서 결정 (순환참조 검출)
//   4) 순서대로 evalAst → MODEL[k].v 갱신
//
// 수식 문법:
//   산술:       + - * /  (괄호 지원)
//   비교:       == != < > <= >=
//   함수:       SUM(a,b,..)  MIN/MAX/AVG  IF(c,t,e)  PREV(x)
//   변수 참조:  다른 노드의 id (e.g. unit_q)
//   값은 모두 길이 YRS.length 배열, 연도별 element-wise 평가.
// ============================================================

// ----- Tokenizer -----
function tokenize(s){
  let i=0, t=[];
  while(i<s.length){
    let c=s[i];
    if(/\s/.test(c)){ i++; continue; }
    if(/\d/.test(c) || (c==='.' && /\d/.test(s[i+1]))){
      let m=s.slice(i).match(/^\d*\.?\d+([eE][-+]?\d+)?/);
      t.push({type:'num',val:parseFloat(m[0])}); i+=m[0].length; continue;
    }
    if(/[a-zA-Z_]/.test(c)){
      let m=s.slice(i).match(/^[a-zA-Z_][a-zA-Z_0-9]*/);
      t.push({type:'ident',val:m[0]}); i+=m[0].length; continue;
    }
    if('+-*/(),'.includes(c)){ t.push({type:'op',val:c}); i++; continue; }
    if((c==='='||c==='!') && s[i+1]==='='){ t.push({type:'cmp',val:c+'='}); i+=2; continue; }
    if(c==='<'||c==='>'){
      if(s[i+1]==='='){ t.push({type:'cmp',val:c+'='}); i+=2; }
      else { t.push({type:'cmp',val:c}); i++; }
      continue;
    }
    throw new Error('알 수 없는 문자: '+c);
  }
  return t;
}

// ----- Parser (recursive descent) -----
function parseFormula(s){
  let tokens=tokenize(s), pos=0;
  function peek(){ return tokens[pos]; }
  function eat(type,val){
    let tk=tokens[pos];
    if(!tk||tk.type!==type||(val!==undefined&&tk.val!==val))
      throw new Error('파싱 오류: "'+(tk?tk.val:'끝')+'" — '+(val||type)+' 기대');
    pos++; return tk;
  }
  function parseExpr(){ return parseCmp(); }
  function parseCmp(){
    let l=parseSum();
    while(peek()&&peek().type==='cmp'){
      let op=eat('cmp').val, r=parseSum();
      l={kind:'cmp',op,l,r};
    }
    return l;
  }
  function parseSum(){
    let l=parseTerm();
    while(peek()&&(peek().val==='+'||peek().val==='-')){
      let op=eat('op').val, r=parseTerm();
      l={kind:'bin',op,l,r};
    }
    return l;
  }
  function parseTerm(){
    let l=parseFactor();
    while(peek()&&(peek().val==='*'||peek().val==='/')){
      let op=eat('op').val, r=parseFactor();
      l={kind:'bin',op,l,r};
    }
    return l;
  }
  function parseFactor(){
    let t=peek();
    if(!t) throw new Error('수식이 비어있음');
    if(t.val==='-'){ eat('op'); return {kind:'neg',x:parseFactor()}; }
    if(t.val==='('){ eat('op','('); let e=parseExpr(); eat('op',')'); return e; }
    if(t.type==='num'){ eat('num'); return {kind:'num',val:t.val}; }
    if(t.type==='ident'){
      eat('ident');
      if(peek()&&peek().val==='('){
        eat('op','(');
        let args=[];
        if(peek()&&peek().val!==')'){
          args.push(parseExpr());
          while(peek()&&peek().val===','){ eat('op'); args.push(parseExpr()); }
        }
        eat('op',')');
        return {kind:'fn',name:t.val,args};
      }
      return {kind:'ref',name:t.val};
    }
    throw new Error('파싱 오류: 예기치 못한 토큰 "'+t.val+'"');
  }
  let ast=parseExpr();
  if(peek()) throw new Error('수식 뒤에 잉여 토큰: "'+peek().val+'"');
  return ast;
}

// ----- 의존 변수 추출 -----
// 참조를 두 종류로 나눈다.
//   hard   — 같은 연도의 값을 읽는다. 평가 순서를 강제한다.
//   lagged — PREV() 안에 있어 직전 연도의 값을 읽는다. 순서를 강제하지 않는다.
// 이 구분이 자기참조 누적(x = PREV(x) + y)을 순환이 아니게 만든다.
function extractDeps(ast, set, lagged, inPrev){
  if(!set) set=new Set();
  if(!ast) return set;
  let sink = inPrev ? (lagged || set) : set;
  if(ast.kind==='ref') sink.add(ast.name);
  let prev = inPrev || (ast.kind==='fn' && ast.name.toUpperCase()==='PREV');
  if(ast.l) extractDeps(ast.l,set,lagged,inPrev);
  if(ast.r) extractDeps(ast.r,set,lagged,inPrev);
  if(ast.x) extractDeps(ast.x,set,lagged,inPrev);
  if(ast.args) ast.args.forEach(a=>extractDeps(a,set,lagged,prev));
  return set;
}

// ----- 단일 연도 평가 -----
// 값 하나를 돌려준다. env[k]는 길이 YRS.length 배열이고, 연도 t를 계산하는
// 시점에 t-1은 전부 확정돼 있다는 것이 이 함수가 기대는 유일한 전제다.
function evalAstAt(ast, env, t){
  switch(ast.kind){
    case 'num': return ast.val;
    case 'ref': {
      let v=env[ast.name];
      if(v===undefined) throw new Error('미정의 변수: '+ast.name);
      let x=v[t];
      return (typeof x==='number' && isFinite(x)) ? x : 0;
    }
    case 'neg': return -evalAstAt(ast.x,env,t);
    case 'bin': {
      let a=evalAstAt(ast.l,env,t), b=evalAstAt(ast.r,env,t);
      switch(ast.op){
        case '+': return a+b;
        case '-': return a-b;
        case '*': return a*b;
        case '/': return b===0?0:a/b;
      }
      throw new Error('알 수 없는 연산자: '+ast.op);
    }
    case 'cmp': {
      let a=evalAstAt(ast.l,env,t), b=evalAstAt(ast.r,env,t);
      switch(ast.op){
        case '==': return a===b?1:0;
        case '!=': return a!==b?1:0;
        case '<':  return a<b?1:0;
        case '>':  return a>b?1:0;
        case '<=': return a<=b?1:0;
        case '>=': return a>=b?1:0;
      }
      throw new Error('알 수 없는 비교연산자: '+ast.op);
    }
    case 'fn': {
      let fn=ast.name.toUpperCase();
      // PREV만 t를 옮겨 평가한다. 누적이 성립하는 지점.
      if(fn==='PREV'){
        if(ast.args.length!==1) throw new Error('PREV는 1개 인자 필요');
        return t===0 ? 0 : evalAstAt(ast.args[0],env,t-1);
      }
      let args=ast.args.map(a=>evalAstAt(a,env,t));
      switch(fn){
        case 'SUM': return args.reduce((s,x)=>s+x,0);
        case 'MIN': return Math.min.apply(null,args);
        case 'MAX': return Math.max.apply(null,args);
        case 'AVG': return args.reduce((s,x)=>s+x,0)/args.length;
        case 'IF':
          if(args.length!==3) throw new Error('IF는 3개 인자 필요');
          return args[0]?args[1]:args[2];
      }
      throw new Error('미정의 함수: '+ast.name);
    }
  }
  throw new Error('알 수 없는 AST');
}

// ----- 평가 (element-wise on length YRS.length) -----
function evalAst(ast, env){
  let N=YRS.length;
  switch(ast.kind){
    case 'num': return Array(N).fill(ast.val);
    case 'ref': {
      let v=env[ast.name];
      if(v===undefined) throw new Error('미정의 변수: '+ast.name);
      return v.slice();
    }
    case 'neg': return evalAst(ast.x,env).map(v=>-v);
    case 'bin': {
      let a=evalAst(ast.l,env), b=evalAst(ast.r,env);
      return a.map((x,i)=>{
        let y=b[i];
        switch(ast.op){
          case '+': return x+y;
          case '-': return x-y;
          case '*': return x*y;
          case '/': return y===0?0:x/y;
        }
      });
    }
    case 'cmp': {
      let a=evalAst(ast.l,env), b=evalAst(ast.r,env);
      return a.map((x,i)=>{
        let y=b[i];
        switch(ast.op){
          case '==': return x===y?1:0;
          case '!=': return x!==y?1:0;
          case '<':  return x<y?1:0;
          case '>':  return x>y?1:0;
          case '<=': return x<=y?1:0;
          case '>=': return x>=y?1:0;
        }
      });
    }
    case 'fn': {
      let args=ast.args.map(a=>evalAst(a,env));
      let fn=ast.name.toUpperCase();
      switch(fn){
        case 'SUM':  return Array(N).fill(0).map((_,i)=>args.reduce((s,a)=>s+a[i],0));
        case 'MIN':  return Array(N).fill(0).map((_,i)=>Math.min(...args.map(a=>a[i])));
        case 'MAX':  return Array(N).fill(0).map((_,i)=>Math.max(...args.map(a=>a[i])));
        case 'AVG':  return Array(N).fill(0).map((_,i)=>args.reduce((s,a)=>s+a[i],0)/args.length);
        case 'IF':
          if(args.length!==3) throw new Error('IF는 3개 인자 필요');
          return Array(N).fill(0).map((_,i)=>args[0][i]?args[1][i]:args[2][i]);
        case 'PREV':
          if(args.length!==1) throw new Error('PREV는 1개 인자 필요');
          return Array(N).fill(0).map((_,i)=>i===0?0:args[0][i-1]);
        default: throw new Error('미정의 함수: '+ast.name);
      }
    }
  }
  throw new Error('알 수 없는 AST');
}

// ----- 토폴로지 정렬 -----
function topoSort(){
  let order=[], visited=new Set(), visiting=new Set();
  // 이전 회차의 오류는 여기서 한 번에 지운다. 순회 중에 지우면 방금 표시한
  // 순환 오류를 다른 노드의 방문이 되돌려 지운다.
  for(let k in MODEL){ if(MODEL[k]) MODEL[k]._error=null; }
  function visit(k, path){
    if(visited.has(k)) return;
    if(visiting.has(k)){
      let at=path.indexOf(k);
      let cyc=(at<0?path:path.slice(at)).concat(k);
      let err=new Error('순환 참조: '+cyc.join(' → '));
      err.cycle=cyc;   // 고리에 걸린 노드 전부를 호출부에 넘긴다
      throw err;
    }
    visiting.add(k);
    let d=MODEL[k];
    if(d && d.type==='computed' && d.formula){
      try{
        if(!d._ast) d._ast=parseFormula(d.formula);
        if(!d._deps){
          // hard는 set으로, PREV 안의 참조는 lagged로 갈라져 담긴다.
          // 그래서 _deps는 이미 같은 연도 참조만 남는다.
          d._lagged=new Set();
          d._deps=extractDeps(d._ast,new Set(),d._lagged,false);
        }
        for(let dep of d._deps){
          if(MODEL[dep]) visit(dep, [...path, k]);
        }
      } catch(e){
        d._error=e.message;
        // 고리 전체에 표시한다. 한 노드만 표시하면 나머지는
        // 계산되지 않은 0을 정상값처럼 내놓는다.
        if(e.cycle) e.cycle.forEach(x=>{ if(MODEL[x]) MODEL[x]._error=e.message; });
      }
    }
    visiting.delete(k);
    visited.add(k);
    order.push(k);
  }
  for(let k in MODEL){
    try{ visit(k, []); } catch(e){
      if(MODEL[k]) MODEL[k]._error=e.message;
      if(e.cycle) e.cycle.forEach(x=>{ if(MODEL[x]) MODEL[x]._error=e.message; });
    }
  }
  return order;
}

// ----- 메인 simCalc (generic evaluator) -----
function simCalc(){
  let order=graphDeps().order;   // 구조가 안 바뀌면 위상정렬을 다시 돌리지 않는다
  let env={};
  // 입력값: SV → env, MODEL.v
  for(let k in MODEL){
    if(MODEL[k].type==='input'){
      let v=(SV[k]||MODEL[k].v||[]).slice();
      // YRS 길이에 맞추기
      while(v.length<YRS.length) v.push(0);
      v.length=YRS.length;
      env[k]=v;
      MODEL[k].v=v;
    }
  }
  // computed 노드의 값 배열을 먼저 깔아둔다. PREV가 t-1을 읽으려면
  // 아직 계산되지 않은 노드에도 자리가 있어야 한다.
  let computed=[];
  for(let k of order){
    let d=MODEL[k];
    if(!d||d.type!=='computed'||!d._ast) continue;
    // topoSort가 이미 잡아낸 노드(파싱 실패·순환)는 평가하지 않는다.
    // env에 자리를 만들어주면 순환이 0으로 조용히 계산돼 버린다.
    if(d._error) continue;
    computed.push(k);
    env[k]=Array(YRS.length).fill(0);
  }
  // 연도가 바깥, 노드가 안쪽. 연도 t를 계산할 때 t-1은 전부 확정돼 있다.
  let failed=new Set();
  for(let t=0;t<YRS.length;t++){
    for(let k of computed){
      if(failed.has(k)) continue;
      let d=MODEL[k];
      try{
        env[k][t]=evalAstAt(d._ast, env, t);
      } catch(e){
        d._error=e.message;
        failed.add(k);
        env[k]=(d.v||Array(YRS.length).fill(0)).slice();  // 이전 값 유지
      }
    }
  }
  for(let k of computed){
    let d=MODEL[k];
    if(failed.has(k)) continue;
    d.v=env[k];
    d._error=null;
  }
  // 변경 자동 저장 (debounced 300ms)
  if(typeof saveToStorage==='function') saveToStorage();
}

// 캐시 무효화 — formula·MODEL 구조 변경 시 호출
function clearFormulaCache(){
  for(let k in MODEL){
    delete MODEL[k]._ast;
    delete MODEL[k]._deps;
    delete MODEL[k]._lagged;
  }
}

// ============================================================
// 엑셀 다운로드 — 수식 그대로 박힌 .xlsx 생성 (SheetJS 사용)
//
// 레이아웃:
//   A: Variable ID  |  B: Label  |  C: Unit  |  MODEL..: 연도별 값/수식
//   - input 노드: 값 리터럴
//   - computed 노드: Excel formula (변수 참조 = 해당 변수 행의 같은 연도 열)
// ============================================================
function _colLetter(idx){
  // 0=A, 25=Z, 26=AA, ...
  let r=''; let n=idx;
  while(n>=0){ r=String.fromCharCode(65+n%26)+r; n=Math.floor(n/26)-1; }
  return r;
}

function astToExcel(ast, year, rowMap){
  function _ref(name, yr){
    let row=rowMap[name];
    if(!row) throw new Error('미정의 변수: '+name);
    return _colLetter(3+yr)+row;  // MODEL=0, E=1, ...
  }
  switch(ast.kind){
    case 'num': return String(ast.val);
    case 'ref': return _ref(ast.name, year);
    case 'neg': return '(-'+astToExcel(ast.x, year, rowMap)+')';
    case 'bin': {
      let l=astToExcel(ast.l, year, rowMap);
      let r=astToExcel(ast.r, year, rowMap);
      return '('+l+ast.op+r+')';
    }
    case 'cmp': {
      let l=astToExcel(ast.l, year, rowMap);
      let r=astToExcel(ast.r, year, rowMap);
      let op=ast.op==='=='?'=':ast.op==='!='?'<>':ast.op;
      return '('+l+op+r+')';
    }
    case 'fn': {
      let fn=ast.name.toUpperCase();
      if(['SUMALL','LAST','FIRST'].includes(fn)){
        if(ast.args.length!==1||ast.args[0].kind!=='ref') throw new Error(fn+'는 변수 참조 1개만 지원');
        let row=rowMap[ast.args[0].name];
        if(!row) throw new Error('미정의 변수: '+ast.args[0].name);
        if(fn==='SUMALL') return 'SUM('+_colLetter(3)+row+':'+_colLetter(3+YRS.length-1)+row+')';
        if(fn==='LAST') return _colLetter(3+YRS.length-1)+row;
        if(fn==='FIRST') return _colLetter(3)+row;
      }
      let args=ast.args.map(a=>astToExcel(a, year, rowMap));
      switch(fn){
        case 'SUM': return 'SUM('+args.join(',')+')';
        case 'MIN': return 'MIN('+args.join(',')+')';
        case 'MAX': return 'MAX('+args.join(',')+')';
        case 'AVG': return 'AVERAGE('+args.join(',')+')';
        case 'IF':  return 'IF('+args[0]+','+args[1]+','+args[2]+')';
        case 'PREV': {
          if(year===0) return '0';
          let inner=ast.args[0];
          if(inner.kind!=='ref') throw new Error('PREV는 변수 참조만 지원');
          return _ref(inner.name, year-1);
        }
        default: throw new Error('미지 함수: '+fn);
      }
    }
  }
  throw new Error('AST 변환 실패');
}

// 보조 JSON 내보내기
function exportToJSON(){
  let payload={
    version: 1,
    YRS: YRS.slice(),
    HIST_N: HIST_N,
    MODEL: _serializeModel(),
    SV: Object.fromEntries(Object.entries(SV).map(([k,v])=>[k,v.slice()])),
  };
  let blob=new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  let url=URL.createObjectURL(blob);
  let a=document.createElement('a');
  let ts=new Date().toISOString().slice(0,10);
  a.href=url; a.download='financial_model_'+ts+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function _excelNumberFormat(d){
  if(d&&d.pct)return '0.0%';
  let u=d&&d.u?d.u:'';
  if(u==='x')return '0.0"x"';
  if(['대','명','건','주'].includes(u))return '#,##0;(#,##0);"-"';
  if(u==='%')return '0.0%;(0.0%);"-"';
  if(isMoney(u))return UNITS.excelMoneyFormat || '_-* #,##0_-;-* #,##0_-;_-* "-"_-;_-@_-';
  if(_uList(UNITS.excelOneDecimal).some(t=>u.includes(t)))return '_-* #,##0.0_-;-* #,##0.0_-;_-* "-"_-;_-@_-';
  if(_uList(UNITS.excelTwoDecimal).some(t=>u.includes(t)))return '_-* #,##0.00_-;-* #,##0.00_-;_-* "-"_-;_-@_-';
  return '_-* #,##0_-;-* #,##0_-;_-* "-"_-;_-@_-';
}
