// 기존 스타일에 트리 깊이만큼 들여쓰기를 얹는다.
// _excelMergeStyle은 얕은 병합이라 alignment를 통째로 다시 준다.
function _excelIndentStyle(base, level){
  let a=Object.assign({},base.alignment||{},{vertical:'center',indent:Math.max(0,Math.min(level,8))});
  return Object.assign({},base,{alignment:a});
}

function _excelSheetRef(name){
  return "'"+String(name).replace(/'/g,"''")+"'";
}

function _excelDescendants(root){
  let out=[];
  function walk(k){
    if(!MODEL[k]) return;
    out.push(k);
    Object.keys(MODEL).forEach(child=>{
      if(MODEL[child]&&MODEL[child].parent===k) walk(child);
    });
  }
  walk(root);
  return out;
}

function _excelOrderedExisting(order, ids){
  let wanted=new Set(ids);
  return order.filter(k=>wanted.has(k));
}

function _excelSafeSheetName(name, fallback){
  let s=String(name||fallback||'Sheet').replace(/[\\/?*:[\]]/g,' ').trim()||fallback||'Sheet';
  if(s.length>31) s=s.slice(0,31).trim();
  return s || 'Sheet';
}

function _excelGenericSheets(order){
  let groups={};
  let roots=Object.keys(MODEL).filter(k=>MODEL[k]&&MODEL[k].parent===null);
  let top=[];
  roots.forEach(root=>{
    Object.keys(MODEL).forEach(k=>{ if(MODEL[k]&&MODEL[k].parent===root) top.push(k); });
  });
  if(!top.length) top=roots;
  top.forEach(k=>{
    let label=MODEL[k]&&MODEL[k].label?MODEL[k].label:k;
    let sheet=_excelSafeSheetName(label,k);
    let base=sheet, n=2;
    while(groups[sheet]) sheet=_excelSafeSheetName(base.slice(0,27)+' '+n++,base);
    groups[sheet]=_excelOrderedExisting(order,_excelDescendants(k));
  });
  return groups;
}

function _excelModelSheets(order){
  // 회사별 전용 시트가 필요하면 { 시트명: [노드 id] }를 돌려준다.
  return {};
}

function _excelImportantOutputs(order){
  let preferred=[
    'root','rev','total_cost','op_profit','fcff','enterprise_value','equity_value','value_per_share'
  ];
  let out=preferred.filter(k=>MODEL[k]);
  Object.keys(MODEL).forEach(k=>{
    if(MODEL[k]&&(MODEL[k].parent==null||MODEL[k].parent==='root')&&!out.includes(k)) out.push(k);
  });
  for(let k of order){
    if(out.length>=24) break;
    if(MODEL[k]&&MODEL[k].type==='computed'&&!out.includes(k)) out.push(k);
  }
  return out;
}

function _excelTreeOrder(){
  let out=[], seen=new Set();
  function walk(k){
    if(!MODEL[k]||seen.has(k)) return;
    seen.add(k); out.push(k);
    Object.keys(MODEL).forEach(child=>{
      if(MODEL[child]&&MODEL[child].parent===k) walk(child);
    });
  }
  Object.keys(MODEL).forEach(k=>{ if(!MODEL[k].parent) walk(k); });
  Object.keys(MODEL).forEach(walk);
  return out;
}

function _excelLevels(){
  let memo={};
  function lvl(k){
    if(memo[k]!=null) return memo[k];
    let p=MODEL[k]&&MODEL[k].parent;
    memo[k]=(!p||!MODEL[p])?0:lvl(p)+1;
    return memo[k];
  }
  Object.keys(MODEL).forEach(lvl);
  return memo;
}

function astToExcelSheet(ast, year, localRowMap, modelRowMap){
  function ref(name, yr){
    let col=_colLetter(EXCEL_DATA_START_COL+yr);
    if(localRowMap&&localRowMap[name]) return col+localRowMap[name];
    if(modelRowMap&&modelRowMap[name]) return _excelSheetRef('Model')+'!'+col+modelRowMap[name];
    throw new Error('미정의 변수: '+name);
  }
  function refRange(name){
    let start=_colLetter(EXCEL_DATA_START_COL);
    let end=_colLetter(EXCEL_DATA_START_COL+YRS.length-1);
    if(localRowMap&&localRowMap[name]) return start+localRowMap[name]+':'+end+localRowMap[name];
    if(modelRowMap&&modelRowMap[name]) return _excelSheetRef('Model')+'!'+start+modelRowMap[name]+':'+end+modelRowMap[name];
    throw new Error('미정의 변수: '+name);
  }
  function refEdge(name, edge){
    let col=edge==='last'?_colLetter(EXCEL_DATA_START_COL+YRS.length-1):_colLetter(EXCEL_DATA_START_COL);
    if(localRowMap&&localRowMap[name]) return col+localRowMap[name];
    if(modelRowMap&&modelRowMap[name]) return _excelSheetRef('Model')+'!'+col+modelRowMap[name];
    throw new Error('미정의 변수: '+name);
  }
  switch(ast.kind){
    case 'num': return String(ast.val);
    case 'ref': return ref(ast.name, year);
    case 'neg': return '(-'+astToExcelSheet(ast.x, year, localRowMap, modelRowMap)+')';
    case 'bin': return '('+astToExcelSheet(ast.l, year, localRowMap, modelRowMap)+ast.op+astToExcelSheet(ast.r, year, localRowMap, modelRowMap)+')';
    case 'cmp': {
      let op=ast.op==='=='?'=':ast.op==='!='?'<>':ast.op;
      return '('+astToExcelSheet(ast.l, year, localRowMap, modelRowMap)+op+astToExcelSheet(ast.r, year, localRowMap, modelRowMap)+')';
    }
    case 'fn': {
      let fn=ast.name.toUpperCase();
      if(['SUMALL','LAST','FIRST'].includes(fn)){
        if(ast.args.length!==1||ast.args[0].kind!=='ref') throw new Error(fn+'는 변수 참조 1개만 지원');
        let name=ast.args[0].name;
        if(fn==='SUMALL') return 'SUM('+refRange(name)+')';
        if(fn==='LAST') return refEdge(name,'last');
        if(fn==='FIRST') return refEdge(name,'first');
      }
      if(fn==='PREV'){
        if(year===0) return '0';
        let inner=ast.args[0];
        if(inner.kind!=='ref') throw new Error('PREV는 변수 참조만 지원');
        return ref(inner.name, year-1);
      }
      let args=ast.args.map(a=>astToExcelSheet(a, year, localRowMap, modelRowMap));
      if(fn==='AVG') return 'AVERAGE('+args.join(',')+')';
      return fn+'('+args.join(',')+')';
    }
  }
  throw new Error('AST 변환 실패');
}

function _excelMakeSheet(){
  return {};
}

function _excelSet(ws,r,c,cell){
  ws[XLSX.utils.encode_cell({r:r-1,c:c-1})]=cell;
}

function _excelCell(ws,r,c){
  return ws[XLSX.utils.encode_cell({r:r-1,c:c-1})];
}

function _excelMergeStyle(base, extra){
  return Object.assign({}, base||{}, extra||{});
}

function _excelSetValue(ws,r,c,v,d,style){
  let cell={v:v==null?'':v,t:typeof v==='number'?'n':'s'};
  if(d) cell.z=_excelNumberFormat(d);
  if(style) cell.s=style;
  _excelSet(ws,r,c,cell);
}

function _excelSetFormula(ws,r,c,f,v,d,style){
  // 캐시값 타입은 값에서 추론한다. 숫자 셀(t:'n')에 문자열 <v>가 들어가면
  // Excel이 파일을 손상으로 판단하고 복구 창을 띄운다 (예: Index 시트 HYPERLINK).
  let val=v==null?0:v;
  let num=typeof val==='number'&&isFinite(val);
  if(typeof val==='number'&&!isFinite(val)) val=0, num=true;
  _excelSet(ws,r,c,{f:f,v:val,t:num?'n':'s',z:num?_excelNumberFormat(d):undefined,s:style||EXCEL_STYLE.formula});
}

function _excelStyleCell(ws,r,c,style){
  let cell=_excelCell(ws,r,c);
  if(cell) cell.s=_excelMergeStyle(cell.s,style);
}

function _excelStyleRow(ws,r,c1,c2,style){
  for(let c=c1;c<=c2;c++){
    let cell=_excelCell(ws,r,c);
    if(!cell){ cell={v:'',t:'s'}; _excelSet(ws,r,c,cell); }
    cell.s=_excelMergeStyle(cell.s,style);
  }
}

function _excelApplyHorizontalBorders(ws,startRow,endRow,endCol){
  for(let r=startRow;r<=endRow;r++) _excelStyleRow(ws,r,2,endCol,EXCEL_STYLE.rowBorder);
}

function _excelApplyDefaultStyles(ws,rowCount,colCount,sheetName){
  ws['!views']=[{showGridLines:false,zoomScale:100}];
  ws['!rows']=Array.from({length:rowCount},(_,i)=>({hpt:i===0?16.5:15}));
  for(let r=1;r<=rowCount;r++){
    for(let c=1;c<=colCount;c++){
      let cell=_excelCell(ws,r,c);
      if(!cell) continue;
      if(r===1&&c===2){ cell.s=EXCEL_STYLE.title; continue; }
      if(r===3||r===4){ cell.s=_excelMergeStyle(EXCEL_STYLE.header,cell.s); continue; }
      // 기본 스타일은 '없을 때 채우는 값'이다. 셀에 이미 지정된 스타일이 이겨야
      // 계정명의 굵기·들여쓰기가 살아남는다. (예전엔 병합 방향이 반대라 전부 덮였다.)
      if(c>=2&&c<=6){
        cell.s=_excelMergeStyle(cell.v?EXCEL_STYLE.label:EXCEL_STYLE.meta,cell.s);
      }else if(c===EXCEL_ID_COL){
        cell.s=_excelMergeStyle(EXCEL_STYLE.id,cell.s);
      }else if(c===EXCEL_UNIT_COL){
        cell.s=_excelMergeStyle(EXCEL_STYLE.unit,cell.s);
      }else if(c>=EXCEL_DATA_START_COL+1){
        if(sheetName==='Assumptions'&&!cell.f) cell.s=_excelMergeStyle(cell.s,EXCEL_STYLE.input);
        else if(cell.f&&String(cell.f).includes('!')) cell.s=_excelMergeStyle(cell.s,EXCEL_STYLE.link);
        else if(cell.f) cell.s=_excelMergeStyle(cell.s,EXCEL_STYLE.formula);
      }
    }
  }
}

function _excelWriteIndexSheet(wb,indexRows){
  let ws=_excelMakeSheet();
  _excelSetValue(ws,1,2,'Index',null,EXCEL_STYLE.title);
  _excelSetValue(ws,3,2,'Sheet',null,EXCEL_STYLE.header);
  _excelSetValue(ws,3,3,'Description',null,EXCEL_STYLE.header);
  indexRows.slice(2).forEach((row,i)=>{
    let r=4+i;
    let sheet=String(row[0]).replace(/'/g,"''");
    let label=String(row[0]).replace(/"/g,'""');
    _excelSetFormula(ws,r,2,`HYPERLINK("#'${sheet}'!A1","${label}")`,row[0],null,EXCEL_STYLE.link);
    _excelSetValue(ws,r,3,row[1],null,EXCEL_STYLE.label);
    _excelStyleRow(ws,r,2,3,EXCEL_STYLE.rowBorder);
  });
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:indexRows.length+1,c:2}});
  ws['!cols']=[{wch:1},{wch:22},{wch:80}];
  ws['!rows']=Array.from({length:indexRows.length+2},(_,i)=>({hpt:i===0?16.5:15}));
  ws['!views']=[{showGridLines:false,zoomScale:100}];
  XLSX.utils.book_append_sheet(wb,ws,'Index');
}

function _excelWriteTableSheet(wb,name,headers,rows,widths){
  let ws=_excelMakeSheet();
  _excelSetValue(ws,1,2,name,null,EXCEL_STYLE.title);
  headers.forEach((h,i)=>_excelSetValue(ws,3,2+i,h,null,EXCEL_STYLE.header));
  rows.forEach((row,ri)=>{
    let r=4+ri;
    row.forEach((v,ci)=>{
      let style=(ci===0||ci===2||ci===5)?EXCEL_STYLE.id:EXCEL_STYLE.label;
      _excelSetValue(ws,r,2+ci,v,null,style);
    });
    _excelStyleRow(ws,r,2,headers.length+1,EXCEL_STYLE.rowBorder);
  });
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(3,rows.length+3),c:headers.length}});
  ws['!cols']=[{wch:1},...widths.map(w=>({wch:w}))];
  ws['!rows']=Array.from({length:Math.max(4,rows.length+4)},(_,i)=>({hpt:i===0?16.5:15}));
  ws['!views']=[{showGridLines:false,zoomScale:100}];
  XLSX.utils.book_append_sheet(wb,ws,name);
}

function _excelFinalize(ws,rowCount,colCount,sheetName){
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rowCount-1,c:colCount-1}});
  ws['!cols']=[
    {wch:2},{wch:2},{wch:2},{wch:2},{wch:2},{wch:46},   // A~E 여백 · F 계정명
    {wch:22},{wch:12},...YRS.map(()=>({wch:14}))        // G id · H 단위 · I~ 연도
  ];
  _excelApplyDefaultStyles(ws,rowCount,colCount,sheetName||'');
}

function _excelPatchSheetViewXml(xml){
  let view='<sheetViews><sheetView workbookViewId="0" showGridLines="0" zoomScale="100">'
    +'<selection activeCell="A1" sqref="A1"/>'
    +'</sheetView></sheetViews>';
  if(/<sheetViews>[\s\S]*?<\/sheetViews>/.test(xml)) return xml.replace(/<sheetViews>[\s\S]*?<\/sheetViews>/,view);
  if(/<sheetFormatPr\b[^>]*\/>/.test(xml)) return xml.replace(/(<sheetFormatPr\b[^>]*\/>)/,'$1'+view);
  if(/<dimension\b[^>]*\/>/.test(xml)) return xml.replace(/(<dimension\b[^>]*\/>)/,'$1'+view);
  return xml.replace(/<worksheet([^>]*)>/,'<worksheet$1>'+view);
}

async function _excelDownloadWorkbook(wb, filename){
  if(typeof JSZip==='undefined'){
    XLSX.writeFile(wb,filename,{bookType:'xlsx',cellFormula:true,cellStyles:true});
    return;
  }
  let bytes=XLSX.write(wb,{bookType:'xlsx',type:'array',cellFormula:true,cellStyles:true});
  let zip=await JSZip.loadAsync(bytes);
  let sheetPaths=Object.keys(zip.files).filter(p=>/^xl\/worksheets\/sheet\d+\.xml$/.test(p));
  await Promise.all(sheetPaths.map(async p=>{
    let xml=await zip.file(p).async('string');
    zip.file(p,_excelPatchSheetViewXml(xml));
  }));
  let out=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  let url=URL.createObjectURL(out);
  let a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function _excelWriteNodeSheet(wb,name,nodeIds,levels,modelRowMap,inputRowMap,auditRows){
  let ws=_excelMakeSheet();
  _excelWriteHeaders(ws,name);
  let localRowMap={};
  nodeIds.forEach((k,i)=>{ localRowMap[k]=EXCEL_DATA_START_ROW+1+i; });
  let formulaCount=0;
  let linkCount=0;
  nodeIds.forEach(k=>{
    let d=MODEL[k]; if(!d) return;
    let row=localRowMap[k];
    let isSection=d.type==='computed'&&((levels[k]||0)<=1||['root','rev','total_cost','fcff','valuation'].includes(k));
    // 라벨은 항상 넓은 EXCEL_LABEL_COL(F)에 쓰고, 계층은 Excel 들여쓰기로 표현한다.
    // 좁은 B~E열에 흩어 쓰면 옆 칸이 비어 있지 않은 한 글자가 잘린다.
    _excelSetValue(ws,row,EXCEL_LABEL_COL,d.label||k,null,
      _excelIndentStyle(isSection?EXCEL_STYLE.labelBold:EXCEL_STYLE.label,levels[k]||0));
    _excelSetValue(ws,row,EXCEL_ID_COL,k,null,EXCEL_STYLE.id);
    _excelSetValue(ws,row,EXCEL_UNIT_COL,d.u||'',null,EXCEL_STYLE.unit);
    if(d.type==='input'){
      let arow=inputRowMap[k];
      for(let i=0;i<YRS.length;i++){
        let f=_excelSheetRef('Assumptions')+'!'+_colLetter(EXCEL_DATA_START_COL+i)+arow;
        _excelSetFormula(ws,row,EXCEL_DATA_START_COL+1+i,f,(d.v&&d.v[i]!=null)?d.v[i]:0,d,EXCEL_STYLE.link);
        auditRows.push([name,k,d.label||k,YRS[i],_colLetter(EXCEL_DATA_START_COL+i)+row,'='+f,'assumption link']);
        linkCount++;
      }
    }else if(d.type==='computed'){
      let ast=parseFormula(d.formula||'');
      for(let i=0;i<YRS.length;i++){
        let f=astToExcelSheet(ast,i,localRowMap,modelRowMap);
        _excelSetFormula(ws,row,EXCEL_DATA_START_COL+1+i,f,(d.v&&d.v[i]!=null)?d.v[i]:0,d,isSection?EXCEL_STYLE.output:EXCEL_STYLE.formula);
        auditRows.push([name,k,d.label||k,YRS[i],_colLetter(EXCEL_DATA_START_COL+i)+row,'='+f,'sheet calculation']);
        formulaCount++;
      }
    }
    if(isSection) _excelStyleRow(ws,row,2,EXCEL_DATA_START_COL+YRS.length,k==='root'||k==='fcff'||k==='valuation'?EXCEL_STYLE.output:EXCEL_STYLE.section);
  });
  _excelApplyHorizontalBorders(ws,EXCEL_DATA_START_ROW+1,EXCEL_DATA_START_ROW+nodeIds.length,EXCEL_DATA_START_COL+YRS.length);
  nodeIds.forEach(k=>{
    let d=MODEL[k]; if(!d) return;
    let level=levels[k]||0;
    let isSection=d.type==='computed'&&(level<=1||['root','rev','total_cost','fcff','valuation'].includes(k));
    if(isSection) _excelStyleRow(ws,localRowMap[k],2,EXCEL_DATA_START_COL+YRS.length,k==='root'||k==='fcff'||k==='valuation'?EXCEL_STYLE.totalBorder:EXCEL_STYLE.subtotalBorder);
  });
  _excelFinalize(ws,EXCEL_DATA_START_ROW+nodeIds.length,YRS.length+EXCEL_DATA_START_COL,name);
  XLSX.utils.book_append_sheet(wb,ws,name);
  return {formulaCount,linkCount};
}



function astToExcelR1C1(ast, year, rowMap, currentRow, currentCol){
  function rc(row, col){
    let dr=row-currentRow;
    let dc=col-currentCol;
    let r=dr===0?'R':'R['+dr+']';
    let c=dc===0?'C':'C['+dc+']';
    return r+c;
  }
  function ref(name, yr){
    let row=rowMap[name];
    if(!row) throw new Error('미정의 변수: '+name);
    return rc(row,4+yr);
  }
  switch(ast.kind){
    case 'num': return String(ast.val);
    case 'ref': return ref(ast.name, year);
    case 'neg': return '(-'+astToExcelR1C1(ast.x, year, rowMap, currentRow, currentCol)+')';
    case 'bin': {
      let l=astToExcelR1C1(ast.l, year, rowMap, currentRow, currentCol);
      let r=astToExcelR1C1(ast.r, year, rowMap, currentRow, currentCol);
      return '('+l+ast.op+r+')';
    }
    case 'cmp': {
      let l=astToExcelR1C1(ast.l, year, rowMap, currentRow, currentCol);
      let r=astToExcelR1C1(ast.r, year, rowMap, currentRow, currentCol);
      let op=ast.op==='=='?'=':ast.op==='!='?'<>':ast.op;
      return '('+l+op+r+')';
    }
    case 'fn': {
      let fn=ast.name.toUpperCase();
      if(['SUMALL','LAST','FIRST'].includes(fn)){
        if(ast.args.length!==1||ast.args[0].kind!=='ref') throw new Error(fn+'는 변수 참조 1개만 지원');
        let row=rowMap[ast.args[0].name];
        if(!row) throw new Error('미정의 변수: '+ast.args[0].name);
        if(fn==='SUMALL') return 'SUM('+rc(row,4)+':'+rc(row,4+YRS.length-1)+')';
        if(fn==='LAST') return rc(row,4+YRS.length-1);
        if(fn==='FIRST') return rc(row,4);
      }
      let args=ast.args.map(a=>astToExcelR1C1(a, year, rowMap, currentRow, currentCol));
      switch(fn){
        case 'SUM': return 'SUM('+args.join(',')+')';
        case 'MIN': return 'MIN('+args.join(',')+')';
        case 'MAX': return 'MAX('+args.join(',')+')';
        case 'AVG': return 'AVERAGE('+args.join(',')+')';
        case 'IF': return 'IF('+args[0]+','+args[1]+','+args[2]+')';
        case 'PREV': {
          if(year===0) return '0';
          let inner=ast.args[0];
          if(inner.kind!=='ref') throw new Error('PREV는 변수 참조만 지원');
          return ref(inner.name, year-1);
        }
        default: throw new Error('미지 함수: '+fn);
      }
    }
  }
  throw new Error('AST 변환 실패');
}

function _xmlEsc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function _excelXmlFormula(f){return '='+f.replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
function _downloadFormulaXmlWorkbook(order,rowMap,formulaRows,base,ts){
  let ss='urn:schemas-microsoft-com:office:spreadsheet';
  let rows=[];
  rows.push('<Row>'+['Variable','Label','Unit',...YRS].map(h=>'<Cell><Data ss:Type="String">'+_xmlEsc(h)+'</Data></Cell>').join('')+'</Row>');
  for(let k of order){
    let d=MODEL[k]; if(!d) continue;
    let cells=[k,d.label||k,d.u||''].map(v=>'<Cell><Data ss:Type="String">'+_xmlEsc(v)+'</Data></Cell>');
    if(d.type==='input'){
      for(let i=0;i<YRS.length;i++) cells.push('<Cell><Data ss:Type="Number">'+((d.v&&d.v[i]!=null)?d.v[i]:0)+'</Data></Cell>');
    }else{
      let ast=parseFormula(d.formula||'');
      for(let i=0;i<YRS.length;i++){
        let f=astToExcelR1C1(ast,i,rowMap,rowMap[k],4+i);
        let v=(d.v&&d.v[i]!=null)?d.v[i]:0;
        cells.push('<Cell ss:Formula="'+_excelXmlFormula(f)+'"><Data ss:Type="Number">'+v+'</Data></Cell>');
      }
    }
    rows.push('<Row>'+cells.join('')+'</Row>');
  }
  let auditRows=[];
  auditRows.push('<Row>'+['ID','Label','Year','Cell','Formula'].map(h=>'<Cell><Data ss:Type="String">'+_xmlEsc(h)+'</Data></Cell>').join('')+'</Row>');
  formulaRows.forEach(r=>{
    auditRows.push('<Row>'+r.map(v=>'<Cell><Data ss:Type="String">'+_xmlEsc(v)+'</Data></Cell>').join('')+'</Row>');
  });
  let indexRows=['Financial Model Index','Index / Control / Model / Formula Audit / Checks / Metadata'].map(v=>'<Row><Cell><Data ss:Type="String">'+_xmlEsc(v)+'</Data></Cell></Row>').join('');
  let checksRows='<Row><Cell><Data ss:Type="String">Check</Data></Cell><Cell><Data ss:Type="String">Result</Data></Cell></Row>'
    +'<Row><Cell><Data ss:Type="String">Formula cells generated</Data></Cell><Cell><Data ss:Type="Number">'+formulaRows.length+'</Data></Cell></Row>'
    +'<Row><Cell><Data ss:Type="String">Formula cells > 0</Data></Cell><Cell><Data ss:Type="String">'+(formulaRows.length>0?'OK':'FAIL')+'</Data></Cell></Row>';
  let controlRows='<Row><Cell><Data ss:Type="String">Control / Key Outputs</Data></Cell></Row>';
  let metaRows='<Row><Cell><Data ss:Type="String">Generated by</Data></Cell><Cell><Data ss:Type="String">HTML exportToExcel fallback</Data></Cell></Row>';
  let xml='<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>'
    +'<Workbook xmlns="'+ss+'" xmlns:ss="'+ss+'">'
    +'<Worksheet ss:Name="Index"><Table>'+indexRows+'</Table></Worksheet>'
    +'<Worksheet ss:Name="Control"><Table>'+controlRows+'</Table></Worksheet>'
    +'<Worksheet ss:Name="Model"><Table>'+rows.join('')+'</Table></Worksheet>'
    +'<Worksheet ss:Name="Formula Audit"><Table>'+auditRows.join('')+'</Table></Worksheet>'
    +'<Worksheet ss:Name="Checks"><Table>'+checksRows+'</Table></Worksheet>'
    +'<Worksheet ss:Name="Metadata"><Table>'+metaRows+'</Table></Worksheet>'
    +'</Workbook>';
  let blob=new Blob([xml],{type:'application/vnd.ms-excel'});
  let url=URL.createObjectURL(blob);
  let a=document.createElement('a');
  a.href=url; a.download=base+'_'+ts+'.xls';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

async function exportToExcel(){
  simCalc();

  let calcOrder;
  try{ calcOrder=topoSort(); }
  catch(e){ alert('순환 참조 때문에 Excel을 생성할 수 없습니다: '+e.message); return; }

  let order=_excelTreeOrder();
  let levels=_excelLevels();
  let modelRowMap={};
  order.forEach((k,i)=>{ modelRowMap[k]=EXCEL_DATA_START_ROW+1+i; });
  let inputOrder=order.filter(k=>MODEL[k]&&MODEL[k].type==='input');
  let inputRowMap={};
  inputOrder.forEach((k,i)=>{ inputRowMap[k]=EXCEL_DATA_START_ROW+1+i; });

  let ts=new Date().toISOString().slice(0,10);
  let base=(document.title||'financial_model').trim().toLowerCase().replace(/[^a-z0-9가-힣]+/gi,'_').replace(/^_+|_+$/g,'')||'financial_model';

  if(typeof XLSX==='undefined'){
    let formulaRows=[];
    let errors=[];
    for(let k of calcOrder){
      let d=MODEL[k]; if(!d||d.type!=='computed') continue;
      if(!d.formula){ errors.push(k+': 계산 노드에 formula 없음'); continue; }
      let ast;
      try{ ast=parseFormula(d.formula); }catch(e){ errors.push(k+': 수식 파싱 실패 — '+e.message); continue; }
      for(let i=0;i<YRS.length;i++){
        try{ formulaRows.push([k,d.label||k,YRS[i],_colLetter(EXCEL_DATA_START_COL+i)+modelRowMap[k],'='+astToExcelSheet(ast,i,modelRowMap,modelRowMap)]); }
        catch(e){ errors.push(k+' '+YRS[i]+': Excel 수식 변환 실패 — '+e.message); }
      }
    }
    if(errors.length){
      alert('Excel 수식 생성 실패:\n'+errors.slice(0,12).join('\n')+(errors.length>12?'\n...':'')+'\n\n값만 들어간 파일은 생성하지 않습니다.');
      return;
    }

  let preferred=['Index','Control','Assumptions','Model','Formula Audit','Structure','Checks','Metadata'];
  wb.SheetNames=[...preferred.filter(s=>wb.SheetNames.includes(s)),...wb.SheetNames.filter(s=>!preferred.includes(s))];
  await _excelDownloadWorkbook(wb,base+'_'+ts+'.xlsx');
}

// ============================================================
// SIM_SECS — 시뮬레이터 슬라이더 정의 (MODEL에서 자동 생성)
//
// 입력 노드(type='input')를 부모(parent)별로 그룹핑하여 섹션 구성.
// min/max/step은 현재값과 단위에서 자동 추정 (필요시 MODEL[k].sliderMin/Max/Step 명시).
// ============================================================
function buildSimSecs(){
  let byParent={};
  for(let k of INPUT_KEYS){
    let d=MODEL[k]; if(!d) continue;
    let p=d.parent||'_orphan';
    (byParent[p]=byParent[p]||[]).push(k);
  }
  let secs=[];
  // root → leaves 순서로 부모 정렬
  let order=[];
  function walk(id){
    let kids=Object.keys(MODEL).filter(k=>MODEL[k].parent===id);
    if(byParent[id]) order.push(id);
    kids.forEach(walk);
  }
  walk('root');
  if(byParent['_orphan']) order.push('_orphan');

  for(let pid of order){
    let p=MODEL[pid]||{};
    let inputs=byParent[pid];
    secs.push({
      t:(p.label||pid)+' 드라이버',
      c:p.bg||p.c||'#5D68F7',
      v:inputs.map(k=>{
        let d=MODEL[k];
        // 사용자 명시값 우선, 없으면 자동 추정
        let cur=d.v && d.v.length ? Math.max(...d.v.map(Math.abs)) : 1;
        let min, max, step, pct;
        if(d.sliderMin!==undefined){
          min=d.sliderMin; max=d.sliderMax; step=d.sliderStep;
        } else if(d.pct){
          min=0; max=1; step=0.001; pct=1;
        } else if(d.u==='%'){
          min=0; max=1; step=0.001; pct=1;
        } else {
          // 현재값의 0~2배 범위, step은 그 1%
          min=0; max=Math.max(cur*2, 1);
          step=Math.max(max/100, 1);
          // 정수 단위 추정 (대/명/건 등은 step=1 이상)
          if(['대','명','건'].includes(d.u)) step=Math.max(Math.round(step), 1);
        }
        return {k, l:d.label, u:d.u, min, max, step, p:pct};
      })
    });
  }
  return secs;
}
SIM_SECS=buildSimSecs();

// ============ SCENARIO (CASE) MANAGEMENT ============
let _cases={}; // {name: {sv: deep copy of SV}}

// data.js가 SCENARIOS를 선언하면 케이스로 미리 올린다. 각 시나리오는
// 덮어쓸 입력만 적으면 되고, 나머지는 초안값(Base)을 그대로 쓴다.
// [주관] 노드만 흔드는 것이 규약이다 — [객관]을 흔들면 다른 모델이 된다.
function seedScenarios(){
  if(typeof SCENARIOS !== 'object' || !SCENARIOS) return;
  for(let name in SCENARIOS){
    let snap={};
    for(let k in DEFAULTS_S) snap[k]=DEFAULTS_S[k].slice();
    let ov=SCENARIOS[name];
    for(let k in ov){ if(snap[k] && ov[k].length===YRS.length) snap[k]=ov[k].slice(); }
    _cases[name]=snap;
  }
}
seedScenarios();
let _activeCase=null; // null = base (기본값 or manual)

function _saveCaseState(){
  let snap={};for(let k in SV)snap[k]=SV[k].slice();return snap;
}
function _loadCaseState(snap){
  for(let k in snap)SV[k]=snap[k].slice();
  simCalc();renderAll();refreshOpenChart();_buildSliders();
  _renderCaseBar();
}
function _addCase(){
  let names=Object.keys(_cases);
  let next=String.fromCharCode(65+names.length); // A, B, C, ...
  if(names.length>=10)return;
  _cases[next]=_saveCaseState();
  _activeCase=next;
  _renderCaseBar();
}
function _switchCase(name){
  if(name===null){
    // Back to base (reset)
    _activeCase=null;
    for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();
    simCalc();renderAll();refreshOpenChart();_buildSliders();
    _renderCaseBar();return;
  }
  // Save current to active case before switching
  if(_activeCase&&_cases[_activeCase])_cases[_activeCase]=_saveCaseState();
  _activeCase=name;
  if(_cases[name])_loadCaseState(_cases[name]);
  _renderCaseBar();
}
function _updateActiveCase(){
  if(_activeCase&&_cases[_activeCase])_cases[_activeCase]=_saveCaseState();
}
function _deleteCase(name){
  delete _cases[name];
  if(_activeCase===name){_activeCase=null;for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();simCalc();renderAll();refreshOpenChart();_buildSliders()}
  _renderCaseBar();
}
function _renderCaseBar(){
  let bar=document.getElementById('_caseBar');if(!bar)return;

  base.textContent='기본값';

    btn.style.cssText='padding:3px 10px;font-size:10px;border-radius:3px;cursor:pointer;font-family:Pretendard,sans-serif;position:relative;border:1px solid '+(_activeCase===name?'#5D68F7':'#E5E5E8')+';background:'+(_activeCase===name?'#5D68F7':'#FFFFFF')+';color:'+(_activeCase===name?'#FFFFFF':'#888');
    btn.textContent='Case '+name;
    btn.onclick=function(){_switchCase(name)};
    // Delete X
    let del=document.createElement('span');
    del.style.cssText='margin-left:6px;color:'+(_activeCase===name?'rgba(255,255,255,0.6)':'#D1D5DB')+';font-size:9px;cursor:pointer';
    del.textContent='✕';
    del.onclick=function(e){e.stopPropagation();_deleteCase(name)};
    btn.appendChild(del);
    bar.appendChild(btn);
  });
  // Add button
  if(Object.keys(_cases).length<10){
    let add=document.createElement('div');
    add.style.cssText='padding:3px 8px;font-size:10px;border-radius:3px;cursor:pointer;border:1px dashed #D1D5DB;color:#9CA3AF';
    add.textContent='+ 케이스';
    add.onclick=_addCase;
    bar.appendChild(add);
  }
  // Count changes vs defaults
  let nChanged=0;for(let k in DEFAULTS_S)for(let i=0;i<YRS.length;i++)if(Math.abs(SV[k][i]-DEFAULTS_S[k][i])>1e-8)nChanged++;
  if(nChanged>0){
    let info=document.createElement('span');
    info.style.cssText='font-size:9px;color:#9CA3AF;margin-left:4px';
    info.textContent=nChanged+'개 변경';
    bar.appendChild(info);
  }
}

    b.style.cssText='flex:1;padding:4px 0;font-size:9px;text-align:center;border:1px solid '+bdr+';border-radius:3px;cursor:'+(isLocked?'not-allowed':'pointer')+';font-family:Pretendard,sans-serif;color:'+fg+';background:'+bg;
    b.textContent=y;
    b.title=isLocked?y+' 실적 (확정값 · 조정 불가)':y+' 추정';
    if(isLocked){
      b.style.borderStyle='dashed';
    } else {
      b.onclick=()=>{
        if(_simYrs.has(i))_simYrs.delete(i);
        else _simYrs.add(i);
        if(_simYrs.size===YRS.length-HIST_N){_simYrs.clear()}  // 추정연도 전부 선택 시 = 전체
        _buildSliders();
      };
    }
    (isLocked?histRow:fcRow).appendChild(b);
  });
  yrWrap.appendChild(histRow);
  yrWrap.appendChild(fcRow);
  bd.appendChild(yrWrap);

  // 전체 접기/펼치기 토글
  let allCollapsed=SIM_SECS.length>0&&SIM_SECS.every(s=>_collapsedSecs.has(s.t));
  let toggleBar=document.createElement('div');
  toggleBar.style.cssText='display:flex;justify-content:flex-end;align-items:center;margin:8px 0 2px;border-top:1px solid #F3F4F6;padding-top:6px';
  let tb=document.createElement('span');
  tb.style.cssText='font-size:10px;color:#5D68F7;cursor:pointer;font-weight:600;user-select:none';
  tb.textContent=allCollapsed?'▸ 전체 펼치기':'▾ 전체 접기';
  tb.onclick=function(){
    if(SIM_SECS.every(s=>_collapsedSecs.has(s.t)))_collapsedSecs.clear();
    else SIM_SECS.forEach(s=>_collapsedSecs.add(s.t));
    _buildSliders();
  };
  toggleBar.appendChild(tb);
  bd.appendChild(toggleBar);

  // Display representative year for slider value (first selected, or 2026)
  let dispYr=activeYrs[0]||1;

  SIM_SECS.forEach(sec=>{
    let isOpen=!_collapsedSecs.has(sec.t);
    let h=document.createElement('div');h.style.cssText='font-size:11px;font-weight:600;color:#374151;margin:12px 0 6px;padding-bottom:3px;border-bottom:2px solid '+sec.c+';cursor:pointer;display:flex;justify-content:space-between;align-items:center';
    h.innerHTML='<span>'+(isOpen?'▼':'▶')+' '+sec.t+'</span><span style="font-size:9px;color:#9CA3AF;font-weight:400">'+sec.v.length+'개 변수</span>';
    h.onclick=function(){if(_collapsedSecs.has(sec.t))_collapsedSecs.delete(sec.t);else _collapsedSecs.add(sec.t);_buildSliders()};
    bd.appendChild(h);
    let secBody=document.createElement('div');secBody.style.display=isOpen?'block':'none';
    bd.appendChild(secBody);
    sec.v.forEach(vr=>{
      let val=SV[vr.k][dispYr],def=DEFAULTS_S[vr.k][dispYr];
      let anyChanged=false;
      for(let j=0;j<YRS.length;j++){if(Math.abs(SV[vr.k][j]-DEFAULTS_S[vr.k][j])>1e-8)anyChanged=true}

      let row=document.createElement('div');row.style.marginBottom='12px';

      // Label
      let lbl=document.createElement('div');lbl.style.cssText='display:flex;justify-content:space-between;font-size:10px;color:#4B5563;margin-bottom:2px';
      let vs=document.createElement('span');vs.style.cssText='font-family:Pretendard,sans-serif;font-weight:500;color:#374151';
      vs.textContent=_sfv(val,vr);
      let yrLabel=activeYrs.length===1?' ('+YRS[activeYrs[0]]+'년)':' ('+activeYrs.length+'개년)';
      lbl.innerHTML='<span>'+vr.l+'<span style="font-size:8px;color:#9CA3AF">'+yrLabel+'</span>'+(anyChanged?' <span style="font-size:9px;color:#5D68F7;cursor:pointer;font-weight:500" class="_rst" data-k="'+vr.k+'">기본값</span>':'')+'</span>';
      lbl.appendChild(vs);row.appendChild(lbl);

      // Single/multi year slider
      let trk=document.createElement('div');trk.style.cssText='position:relative;height:18px;display:flex;align-items:center';
      if(def>=vr.min&&def<=vr.max){let mk=document.createElement('div');mk.style.cssText='position:absolute;top:50%;width:2px;height:10px;background:#5D68F7;border-radius:1px;transform:translate(-50%,-50%);pointer-events:none;z-index:1;left:'+((def-vr.min)/(vr.max-vr.min)*100)+'%';trk.appendChild(mk)}
      let rng=document.createElement('input');rng.type='range';rng.min=vr.min;rng.max=vr.max;rng.step=vr.step;rng.value=val;
      rng.style.cssText='width:100%;margin:0;-webkit-appearance:none;appearance:none;height:4px;background:#E5E7EB;border-radius:2px;outline:none';
      trk.appendChild(rng);row.appendChild(trk);

      rng.addEventListener('input',function(){
        let newVal=+this.value;
        activeYrs.forEach(j=>{SV[vr.k][j]=newVal});
        vs.textContent=_sfv(newVal,vr);
        simCalc();renderAll();refreshOpenChart();_updateActiveCase();
      });

      // Bulk ±% slider
      let bulkRow=document.createElement('div');bulkRow.style.cssText='display:flex;align-items:center;gap:6px;margin-top:4px';
      let bulkLabel=document.createElement('span');bulkLabel.style.cssText='font-size:9px;color:#9CA3AF;white-space:nowrap';bulkLabel.textContent='±%';
      let bulkVal=document.createElement('span');bulkVal.style.cssText='font-size:9px;font-family:Pretendard,sans-serif;color:#4B5563;min-width:36px;text-align:center';bulkVal.textContent='±0%';
      let bulkRng=document.createElement('input');bulkRng.type='range';bulkRng.min='-50';bulkRng.max='100';bulkRng.step='1';bulkRng.value='0';
      bulkRng.style.cssText='flex:1;margin:0;-webkit-appearance:none;appearance:none;height:3px;background:linear-gradient(to right,#DC2626 0%,#E5E7EB 50%,#22C55E 100%);border-radius:2px;outline:none';
      let bulkReset=document.createElement('span');bulkReset.style.cssText='font-size:9px;color:#9CA3AF;cursor:pointer';bulkReset.textContent='↺';
      bulkRow.appendChild(bulkLabel);bulkRow.appendChild(bulkRng);bulkRow.appendChild(bulkVal);bulkRow.appendChild(bulkReset);
      row.appendChild(bulkRow);

      let bulkBase=null;
      bulkRng.addEventListener('mousedown',function(){bulkBase=SV[vr.k].slice()});
      bulkRng.addEventListener('touchstart',function(){bulkBase=SV[vr.k].slice()});
      bulkRng.addEventListener('input',function(){
        let pct=+this.value;
        bulkVal.textContent=(pct>=0?'+':'')+pct+'%';
        bulkVal.style.color=pct>0?'#22C55E':pct<0?'#DC2626':'#4B5563';
        if(!bulkBase)bulkBase=DEFAULTS_S[vr.k].slice();
        activeYrs.forEach(j=>{
          let base=bulkBase[j];
          SV[vr.k][j]=vr.p?Math.max(0,Math.min(vr.max,base*(1+pct/100))):Math.max(vr.min,Math.min(vr.max,Math.round(base*(1+pct/100))));
        });
        rng.value=SV[vr.k][dispYr];
        vs.textContent=_sfv(SV[vr.k][dispYr],vr);
        simCalc();renderAll();refreshOpenChart();_updateActiveCase();
      });
      bulkReset.onclick=function(){
        bulkRng.value=0;bulkVal.textContent='±0%';bulkVal.style.color='#4B5563';
        activeYrs.forEach(j=>{SV[vr.k][j]=DEFAULTS_S[vr.k][j]});
        rng.value=SV[vr.k][dispYr];vs.textContent=_sfv(SV[vr.k][dispYr],vr);
        simCalc();renderAll();refreshOpenChart();_buildSliders();
      };

      // Reset all years for this var
      let rst=lbl.querySelector('._rst');
      if(rst)rst.onclick=function(e){e.stopPropagation();let k=this.dataset.k;for(let j=0;j<YRS.length;j++)SV[k][j]=DEFAULTS_S[k][j];simCalc();renderAll();refreshOpenChart();_buildSliders()};

      secBody.appendChild(row);
    });
  });
}

function _resetSim(){_activeCase=null;for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();simCalc();renderAll();refreshOpenChart();_buildSliders();_renderCaseBar()}


</script>
<script>
// ============================================================
// APP SHELL — 사이드바 트래킹 + 계정별 문서 뷰
//
// 캔버스(트리)는 전체 조망, 사이드바는 요소별 트래킹, 문서 뷰는 계정 단위 상세.
// 엔진(MODEL / SV / simCalc / renderAll)은 그대로 쓰고 읽기만 한다.
// 색상은 전부 design-guide/tokens.js 토큰. 임의 hex 없음.
// ============================================================

// ─── DS 토큰 (design-guide/tokens.js) ───────────────────────
var T = {
  revenue:'#1E2185',   // semantic.revenue / primary.900
  revSub:'#3332D0',    // semantic.revenueSub / primary.700
  cost:'#374151',      // semantic.cost / neutral.700
  costSub:'#6B7280',   // semantic.costSub / neutral.500
  profit:'#22C55E',    // semantic.profit

  p400:'#7C91FD', p300:'#A1B8FF', p200:'#C5D5FF', p100:'#DFE8FF', p50:'#EDF3FF',
  bg:'#FFFFFF', surface:'#F8F8FA', border:'#E5E5E8',

  n50:'#F9FAFB', n100:'#F3F4F6', n200:'#E5E7EB', n300:'#D1D5DB'
};
// 계열 팔레트 — 매출 계열은 primary 램프, 비용 계열은 neutral 램프에서만 뽑는다.
var RAMP_REV  = ['#1E2185','#3332D0','#5D68F7','#7C91FD','#A1B8FF','#C5D5FF','#282CA8','#4B4DED'];
var RAMP_COST = ['#374151','#4B5563','#6B7280','#9CA3AF','#1F2937','#111827','#D1D5DB','#E5E7EB'];

// ─── Feather Icons (인라인 SVG · 다른 아이콘 라이브러리 미사용) ───
var FEATHER = {
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  'git-branch':'<line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
  layers:'<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
  sliders:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
  grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
  'check-circle':'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  'rotate-ccw':'<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',
  'chevron-right':'<polyline points="9 18 15 12 9 6"/>',
  'file-text':'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  'trending-up':'<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
  zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  'book-open':'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  activity:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
  filter:'<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
  'pie-chart':'<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
  'alert-triangle':'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  maximize:'<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>',
  info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  'bar-chart-2':'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  'corner-up-left':'<polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>'
};
// 크기 4단계만 사용: 16 / 20 / 24 / 28 (tokens.js iconSize)
function ic(name, size, color){
  var s = size || 16, p = FEATHER[name] || '';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+'" viewBox="0 0 24 24"'+
    ' fill="none" stroke="'+(color||'currentColor')+'" stroke-width="2" stroke-linecap="round"'+
    ' stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
}

// ─── UI 상태 ────────────────────────────────────────────────
var UI = { view:'canvas', year:Math.max(0, YRS.length-1), collapsed:{} };

// ─── 공통 헬퍼 ──────────────────────────────────────────────
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
// 아래 넷은 시그니처·반환 순서가 예전과 같다. 내부만 GRAPH 조회로 바뀌었다.
// 배열은 복사해서 준다 — 호출부가 정렬·변형해도 색인이 오염되지 않게.
function childrenOf(id){
  var c = GRAPH && GRAPH.children[id];
  return c ? c.slice() : [];
}
function rootId(){
  return (GRAPH && GRAPH.root) || Object.keys(MODEL)[0];
}
function depthOf(id){
  return (GRAPH && GRAPH.depth[id]) || 0;
}
function pathOf(id){
  var p = GRAPH && GRAPH.path[id];
  return p ? p.slice() : [];
}
// 형제 순서로 결정적 배정 — 같은 차트에 함께 그려지는 노드끼리 항상 구분된다.
// (MODEL[k].c는 캔버스 엔진 전용. 여기서 쓰지 않는 이유는 형제 간 중복이 잦아서.)
function isCostish(id){
  var d = MODEL[id] || {};
  if(d.role === 'cost') return true;
  var cur = id, guard = 0;
  while(MODEL[cur] && guard++ < 60){
    if(/cost|expense|비용|원가|판관비/i.test(cur + ' ' + (MODEL[cur].label || ''))) return true;
    cur = MODEL[cur].parent;
  }
  return false;
}
function nodeColor(id){
  var d = MODEL[id]; if(!d) return T.mut;
  var ramp = isCostish(id) ? RAMP_COST : RAMP_REV;
  var sib = childrenOf(d.parent), i = Math.max(0, sib.indexOf(id));
  return ramp[i % ramp.length];
}
function val(id, t){
  var d = MODEL[id]; if(!d || !d.v) return 0;
  var x = d.v[t]; return (typeof x === 'number' && isFinite(x)) ? x : 0;
}
function fmtV(id, t){
  var d = MODEL[id] || {};
  return fmtSmart(val(id, t), d.pct);
}
function cagr(id, from, to){
  var a = val(id, from), b = val(id, to), n = to - from;
  if(!(a > 0) || !(b > 0) || n <= 0) return null;
  return Math.pow(b / a, 1 / n) - 1;
}
function pctText(x, digits){
  if(x == null || !isFinite(x)) return '—';
  return (x >= 0 ? '+' : '') + (x * 100).toFixed(digits == null ? 1 : digits) + '%';
}
function isHist(t){ return t < HIST_N; }
function nInputs(){ var c = 0; INPUT_KEYS.forEach(function(){ c++; }); return c; }
// desc 앞머리의 [주관]/[계산·교차참조] 같은 분류 태그는 화면에 노출하지 않는다.
// 원문(MODEL[k].desc)은 그대로 두고 렌더 직전에만 벗긴다.
function descBody(desc){
  return String(desc || '').replace(/^\s*\[[^\]]*\]\s*/, '').trim();
}
function typeBadge(id){
  var d = MODEL[id] || {};
  if(d.type === 'input') return '<span class="badge input">가정변수 · 입력</span>';
  return '<span class="badge calc">계산</span>';
}

// ─── SVG 차트 ───────────────────────────────────────────────
// series: [{label, color, values:[]}] · stacked=true면 누적
function chartSVG(series, opt){
  opt = opt || {};
  var W = 100, H = opt.height || 34;             // viewBox 단위 (반응형)
  var padL = 3, padR = 1, padT = 4, padB = 6;
  var n = YRS.length;
  if(!n || !series.length) return '';
  var stacked = !!opt.stacked;
  var totals = [], i, s, t;
  for(t = 0; t < n; t++){
    var pos = 0, neg = 0;
    for(i = 0; i < series.length; i++){
      var v = series[i].values[t] || 0;
      if(v >= 0) pos += v; else neg += v;
    }
    totals.push(stacked ? pos : Math.max.apply(null, series.map(function(x){ return x.values[t] || 0; })));
    if(!stacked) totals[t] = Math.max(totals[t], 0);
  }
  var maxV = Math.max.apply(null, totals.concat([0]));
  if(maxV <= 0) maxV = 1;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var colW = plotW / n;
  var barW = stacked ? Math.min(colW * 0.62, 7) : Math.min((colW * 0.72) / series.length, 5);
  var out = '<svg class="fmchart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
  // 실적 구간 음영
  if(HIST_N > 0){
    out += '<rect x="' + padL.toFixed(2) + '" y="' + padT + '" width="' + (colW * HIST_N).toFixed(2) +
           '" height="' + plotH.toFixed(2) + '" fill="' + T.n100 + '" opacity="0.7"/>';
  }
  // 그리드
  for(i = 0; i <= 4; i++){
    var gy = padT + plotH * (i / 4);
    out += '<line class="grid-line" x1="' + padL + '" y1="' + gy.toFixed(2) + '" x2="' + (W - padR) +
           '" y2="' + gy.toFixed(2) + '" vector-effect="non-scaling-stroke"/>';
  }
  for(t = 0; t < n; t++){
    var cx = padL + colW * (t + 0.5);
    if(stacked){
      var acc = 0;
      for(i = 0; i < series.length; i++){
        var vv = series[i].values[t] || 0;
        if(vv <= 0) continue;
        var h = (vv / maxV) * plotH, y = padT + plotH - ((acc + vv) / maxV) * plotH;
        out += '<rect x="' + (cx - barW / 2).toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + barW.toFixed(2) +
               '" height="' + Math.max(h, 0.15).toFixed(2) + '" fill="' + series[i].color + '"><title>' +
               esc(YRS[t] + ' · ' + series[i].label + ' ' + fmtSmart(vv)) + '</title></rect>';
        acc += vv;
      }
    } else {
      for(i = 0; i < series.length; i++){
        var v2 = series[i].values[t] || 0;
        var h2 = (Math.max(v2, 0) / maxV) * plotH;
        var x2 = cx - (barW * series.length) / 2 + barW * i;
        out += '<rect x="' + x2.toFixed(2) + '" y="' + (padT + plotH - h2).toFixed(2) + '" width="' + barW.toFixed(2) +
               '" height="' + Math.max(h2, 0.15).toFixed(2) + '" fill="' + series[i].color +
               '" opacity="' + (isHist(t) ? '1' : '0.85') + '"><title>' +
               esc(YRS[t] + ' · ' + series[i].label + ' ' + fmtSmart(v2)) + '</title></rect>';
      }
    }
  }
  out += '<line class="ax-line" x1="' + padL + '" y1="' + (padT + plotH).toFixed(2) + '" x2="' + (W - padR) +
         '" y2="' + (padT + plotH).toFixed(2) + '" vector-effect="non-scaling-stroke"/>';
  out += '</svg>';
  // 막대 위 값 라벨 — SVG는 preserveAspectRatio="none"이라 글자가 왜곡된다.
  // 따라서 HTML 오버레이로 얹고, viewBox 좌표를 %로 환산해 위치시킨다.
  // 계열이 여러 개인 그룹형(비누적) 차트는 라벨이 겹치므로 생략한다.
  var showVals = opt.values !== false && (stacked || series.length === 1);
  var ovl = '';
  if(showVals){
    ovl = '<div style="position:absolute;inset:0;pointer-events:none">';
    for(t = 0; t < n; t++){
      var tv = totals[t];
      if(!tv) continue;
      var ty = padT + plotH - (tv / maxV) * plotH;          // 막대 상단 y (viewBox 단위)
      ovl += '<div style="position:absolute;left:' + ((padL + colW * (t + 0.5)) / W * 100).toFixed(3) +
             '%;top:' + (ty / H * 100).toFixed(3) + '%;transform:translate(-50%,-118%);' +
             'font-size:8.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;' +
             'color:' + (isHist(t) ? T.body : T.mut) + '">' + esc(fmtSmart(tv)) + '</div>';
    }
    ovl += '</div>';
  }
  out = '<div style="position:relative">' + out + ovl + '</div>';
  // 연도 라벨은 HTML로 (SVG 비균등 스케일에서 글자 왜곡 방지)
  var lab = '<div style="display:flex;padding:2px ' + padR + '% 0 ' + padL + '%">';
  for(t = 0; t < n; t++){
    lab += '<div style="flex:1;text-align:center;font-size:9px;font-weight:' + (isHist(t) ? '700' : '500') +
           ';color:' + (isHist(t) ? T.body : T.mut) + '">' + esc(YRS[t]) + '</div>';
  }
  lab += '</div>';
  return '<div class="chart-box">' + out + lab + '</div>';
}
function legendHTML(series){
  var h = '<div class="legend-row">';
  series.forEach(function(s){
    h += '<span class="legend-item"><i class="legend-dot" style="background:' + s.color + '"></i>' + esc(s.label) + '</span>';
  });
  return h + '</div>';
}

// ─── 사이드바 ───────────────────────────────────────────────
function navBtn(view, iconName, label, valueText){
  return '<button class="nav-item' + (UI.view === view ? ' active' : '') + '" data-view="' + esc(view) + '">' +
    '<span class="ico">' + ic(iconName, 16) + '</span>' +
    '<span class="nav-label">' + esc(label) + '</span>' +

}
function buildSidebar(){
  var t = UI.year, html = '';

  html += '<div class="nav-group"><div class="nav-caption">Overview</div>' +
    navBtn('canvas', 'git-branch', '전체 캔버스') +
    navBtn('summary', 'home', '요약 대시보드', fmtV(rootId(), t)) +
    '</div>';

  // 계정 트리 — 캔버스 openSet과 동기화
  var rows = '', total = 0;
  function walk(id, level){
    total++;
    var d = MODEL[id], kids = childrenOf(id), isInput = d.type === 'input';
    var open = openSet.has(id);
    var col = nodeColor(id);
    rows += '<div class="tree-item' + (UI.view === id ? ' active' : '') + (isInput ? ' is-input' : '') +
      '" style="padding-left:' + (level * 10) + 'px">';

      rows += '<button class="tree-caret' + (open ? ' open' : '') + '" data-toggle="' + esc(id) +
        '" title="펼치기/접기">' + ic('chevron-right', 16) + '</button>';
    } else {
      rows += '<span class="tree-caret"></span>';
    }
    rows += '<button class="tree-btn" data-view="' + esc(id) + '" title="' + esc(d.label || id) + '">' +
      (isInput ? '<i class="dot" style="background:' + T.input + '"></i>'
               : '<i class="bar" style="background:' + col + '"></i>') +
      '<span class="tree-name">' + esc(d.label || id) + '</span>' +
      '<span class="tree-val">' + esc(fmtV(id, t)) + '</span></button></div>';
    if(kids.length && open) kids.forEach(function(k){ walk(k, level + 1); });
  }
  walk(rootId(), 0);
  // 오른쪽 숫자가 어느 해 값인지 캡션에 명시한다 (모델 최종 연도 기준)
  html += '<div class="nav-group"><div class="nav-caption">계정 트리<span class="cap-count">' +
    esc(YRS[t]) + (isHist(t) ? ' 실적' : ' 추정') + '</span></div>' + rows + '</div>';

  // Investment case — MARKET이 선언된 모델에서만 뜬다.
  if(typeof MARKET === 'object' && MARKET){
    html += '<div class="nav-group"><div class="nav-caption">Investment case</div>' +
      navBtn('ic_overview', 'target', '투자 개요', icUpsideLabel()) +
      navBtn('ic_valuation', 'trending-up', '밸류에이션') +
      navBtn('ic_scenario', 'layers', '시나리오',
             (typeof SCENARIOS === 'object' && SCENARIOS)
               ? String(Object.keys(SCENARIOS).length + 1) : '') +
      navBtn('ic_ideas', 'zap', '투자 아이디어',
             (typeof MEMO === 'object' && MEMO && MEMO.ideas)
               ? String(MEMO.ideas.length) : '') +
      navBtn('ic_monitor', 'activity', '분기 모니터링',
             (typeof QUARTERLY === 'object' && QUARTERLY && QUARTERLY.quarters)
               ? String(Object.keys(QUARTERLY.quarters).length) : '') +
      navBtn('ic_sens', 'filter', '민감도') +
      navBtn('ic_verdict', 'file-text', '심사 결론') +
      navBtn('ic_report', 'book-open', '심사 리포트') +
      '</div>';
  }

  html += '<div class="nav-group"><div class="nav-caption">Model control</div>' +
    navBtn('assumptions', 'sliders', '가정·근거', String(nInputs())) +
    navBtn('pl', 'grid', '전체 테이블') +
    navBtn('checks', 'check-circle', '검증·이슈', String(runChecks().filter(function(c){ return c.status !== 'ok'; }).length)) +
    '</div>';

  var el = document.getElementById('sideScroll');
  el.innerHTML = html;
  el.querySelectorAll('[data-view]').forEach(function(b){
    b.addEventListener('click', function(){ go(this.dataset.view); });
  });
  el.querySelectorAll('[data-toggle]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var id = this.dataset.toggle;
      if(openSet.has(id)) openSet.delete(id); else openSet.add(id);
      renderAll(); buildSidebar();
    });
  });
}

// ─── 라우팅 ─────────────────────────────────────────────────
var VIEW_TITLES = { canvas:'전체 캔버스', summary:'요약 대시보드', assumptions:'가정·근거',
  ic_overview:'투자 개요', ic_valuation:'밸류에이션',
  ic_scenario:'시나리오', ic_ideas:'투자 아이디어',
  ic_monitor:'분기 모니터링', ic_sens:'민감도',
  ic_verdict:'심사 결론', ic_report:'심사 리포트',
  pl:'전체 테이블', checks:'검증·이슈' };
function go(view){
  UI.view = view;
  var isCanvas = (view === 'canvas');
  document.getElementById('treePanel').classList.toggle('hidden', !isCanvas);
  document.getElementById('docView').classList.toggle('show', !isCanvas);
  var title = VIEW_TITLES[view] || (MODEL[view] ? (MODEL[view].label || view) : view);
  var path = MODEL[view] ? pathOf(view).slice(0, -1).map(function(k){ return MODEL[k].label || k; }).join(' / ') : 'Model';
  document.getElementById('crumbTitle').textContent = title;
  document.getElementById('crumbPath').textContent = path || 'Model';
  if(isCanvas){
    if(MODEL[UI.lastNode]) { selectedId = UI.lastNode; if(typeof updateSelectedToolbar === 'function') updateSelectedToolbar(); }
    setTimeout(function(){
      resize();
      if(!isFinite(cam.s) || !isFinite(cam.x)) fitAll(); else renderAll();
    }, 0);
  } else {
    if(MODEL[view]){
      UI.lastNode = view;
      // 사이드바에서 해당 노드가 보이도록 상위를 펼친다 (캔버스 openSet과 공유)
      pathOf(view).slice(0, -1).forEach(function(k){ openSet.add(k); });
    }
    document.getElementById('docView').innerHTML = renderView(view);
    document.getElementById('docView').scrollTop = 0;
    bindDoc();
  }
  buildSidebar();
  setDrawer(false);   // 좁은 화면에서는 항목을 고르면 서랍이 비켜야 본문이 보인다
}

// 사이드바 서랍. 넓은 화면에서는 사이드바가 항상 보이므로 아무 일도 하지 않는다.
function setDrawer(open){
  var sb = document.getElementById('sidebar'), sc = document.getElementById('scrim'),
      mb = document.getElementById('menuBtn');
  if(!sb || !sc) return;
  sb.classList.toggle('open', !!open);
  sc.classList.toggle('show', !!open);
  if(mb) mb.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function bindDoc(){
  var root = document.getElementById('docView');
  root.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click', function(){ go(this.dataset.go); });
  });
  root.querySelectorAll('[data-canvas]').forEach(function(b){
    b.addEventListener('click', function(){ focusOnCanvas(this.dataset.canvas); });
  });
  root.querySelectorAll('[data-desc]').forEach(function(b){
    b.addEventListener('click', function(){ showVarDesc(this.dataset.desc); });
  });
  root.querySelectorAll('input[data-inp]').forEach(function(inp){
    inp.addEventListener('change', function(){
      var k = this.dataset.inp, t = +this.dataset.t, v = parseFloat(this.value);
      if(!isFinite(v)) { this.value = SV[k][t]; return; }
      SV[k][t] = v;
      // simCalc → refreshSurfaces()가 사이드바·문서·모달을 한 프레임 뒤에 갱신한다
      simCalc(); renderAll();
      if(typeof refreshOpenChart === 'function') refreshOpenChart();
      if(typeof _buildSliders === 'function' && document.getElementById('simPanel').style.width === '400px') _buildSliders();
    });
  });
}
function focusOnCanvas(id){
  UI.lastNode = id;
  pathOf(id).forEach(function(k){ openSet.add(k); });
  selectedId = id;
  go('canvas');
  setTimeout(function(){
    if(typeof updateSelectedToolbar === 'function') updateSelectedToolbar();
    centerNode(id);
  }, 60);
}
function centerNode(id){
  allNodes = []; positions = {}; parentMap = {};
  doLayout(TREE, PAD, PAD, null);
  var p = positions[id];
  if(!p){ fitAll(); return; }
  cam.s = Math.min(Math.max(cam.s, 0.7), 1.4);
  cam.x = W / 2 - (p.x + p.w / 2) * cam.s;
  cam.y = H / 2 - (p.y + p.h / 2) * cam.s;
  var zl = document.getElementById('zoom-label');
  if(zl) zl.textContent = Math.round(cam.s * 100) + '%';
  renderAll();
}
function openSelectedPage(){ if(selectedId && MODEL[selectedId]) go(selectedId); }

// ─── 값이 바뀔 때마다 모든 표면을 다시 그린다 ────────────────
// 시뮬레이터 슬라이더·케이스 전환·직접 입력·노드 편집은 전부 simCalc()을 거치므로
// 여기 한 곳만 잡으면 캔버스 / 사이드바 / 계정 페이지 / 모달이 같이 움직인다.
// 슬라이더 드래그는 초당 수십 번 발생하니 rAF로 한 프레임에 한 번만 갱신.
var _refreshQueued = false;
function refreshSurfaces(){
  if(_refreshQueued) return;
  _refreshQueued = true;
  requestAnimationFrame(function(){
    _refreshQueued = false;
    try { buildSidebar(); } catch(e){}
    // 문서 뷰 (계정 페이지 / 대시보드 / 가정·근거 / 전체 테이블 / 검증)
    var doc = document.getElementById('docView');
    if(doc && UI.view !== 'canvas'){
      // 편집 중인 입력 칸이 있으면 커서 위치까지 복원
      var ae = document.activeElement, keep = null;
      if(ae && ae.dataset && ae.dataset.inp && doc.contains(ae)){
        keep = { k:ae.dataset.inp, t:ae.dataset.t, s:ae.selectionStart, e:ae.selectionEnd };
      }
      var top = doc.scrollTop;
      doc.innerHTML = renderView(UI.view);
      bindDoc();
      doc.scrollTop = top;
      if(keep){
        var el = doc.querySelector('input[data-inp="' + keep.k + '"][data-t="' + keep.t + '"]');
        if(el){ el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch(e2){} }
      }
    }
    // 열려 있는 모달도 같이 갱신
    var rt = document.getElementById('revTableOverlay');
    if(rt && rt.style.display === 'flex' && typeof showRevTable === 'function') showRevTable();
    var as = document.getElementById('assumOverlay');
    if(as && as.style.display === 'flex' && typeof showAssumptions === 'function') showAssumptions();
  });
}

// ─── 뷰 렌더러 ──────────────────────────────────────────────
function renderView(view){
  if(view === 'ic_overview') return renderICOverview();
  if(view === 'ic_scenario') return renderICScenario();
  if(view === 'ic_ideas') return renderICIdeas();
  if(view === 'ic_monitor') return renderICMonitor();
  if(view === 'ic_sens') return renderICSensitivity();
  if(view === 'ic_report') return renderICReport();
  if(view === 'ic_valuation') return renderICValuation();
  if(view === 'ic_verdict') return renderICVerdict();
  if(view === 'summary') return renderSummary();
  if(view === 'assumptions') return renderAssumPage();
  if(view === 'pl') return renderPLPage();
  if(view === 'checks') return renderChecksPage();
  if(MODEL[view]) return renderAccount(view);
  return '<div class="page"><div class="notice">알 수 없는 뷰: ' + esc(view) + '</div></div>';
}

function card(title, sub, unit, body){
  return '<section class="card"><div class="section-head"><div><h2>' + esc(title) + '</h2>' +
    (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>' +
    (unit ? '<div class="unit">' + esc(unit) + '</div>' : '') + '</div>' +
    '<div class="card-body">' + body + '</div></section>';
}
function kpi(label, value, unit, sub){
  return '<div class="kpi-card"><div class="kpi-label">' + esc(label) + '</div>' +
    '<div class="kpi-value">' + esc(value) + (unit ? '<small>' + esc(unit) + '</small>' : '') + '</div>' +
    (sub ? '<div class="kpi-sub">' + sub + '</div>' : '') + '</div>';

// 연도 헤더
function yearTh(first){

// 노드 1행
function nodeTr(id, level, cls){

// ── 계정 상세 페이지 ──
function renderAccount(id){
  var d = MODEL[id], t = UI.year, kids = childrenOf(id), isInput = d.type === 'input';
  var h = '<div class="page">';

  // head
  var crumbs = pathOf(id).slice(0, -1).map(function(k){
    return '<a data-go="' + esc(k) + '">' + esc(MODEL[k].label || k) + '</a>';
  }).join(' ' + ic('chevron-right', 16) + ' ');
  h += '<div class="page-head"><div class="eyebrow">' + (crumbs || 'ROOT') + '</div>' +
    '<h1>' + esc(d.label || id) + '</h1>' +
    (d.sub ? '<p class="page-desc">' + esc(d.sub) + '</p>' : '') +
    '<div class="badge-row">' + typeBadge(id) +
    '<span class="badge unit">' + esc(d.u || '-') + '</span>' +
    (d.formula ? '<span class="formula-chip">' + esc(d.formula) + '</span>' : '') +
    (d._error ? '<span class="badge err">수식 오류</span>' : '') +
    '<button class="tb-btn" data-canvas="' + esc(id) + '" style="margin-left:4px">' +
      ic('maximize', 16) + ' 캔버스에서 보기</button>' +
    '</div></div>';

  if(d._error){
    h += '<div class="notice err"><span class="notice-icon">' + ic('alert-triangle', 16, T.negative) +
      '</span><div><strong>수식 평가 실패</strong> — ' + esc(d._error) + '</div></div>';
  }

  // KPI 카드 행은 두지 않는다 — 같은 숫자를 아래 추이 차트가 막대 위 값 라벨로 직접 보여준다.

  // 차트 + 근거
  var series;
  if(kids.length){
    series = kids.map(function(k){ return { label:MODEL[k].label || k, color:nodeColor(k), values:MODEL[k].v || [] }; });
  } else {
    series = [{ label:d.label || id, color:nodeColor(id), values:d.v || [] }];
  }
  var stacked = kids.length > 0 && !isInput && isSumOfChildren(id);
  h += '<div class="grid two">';
  h += card(kids.length ? '구성요소별 추이' : '연도별 추이',
    (stacked ? '누적 · ' : '') + '회색 = 실적',
    d.u || '',
    (kids.length > 1 ? legendHTML(series) : '') + chartSVG(series, { stacked:stacked, height:34 }));
  h += card('추정 근거', '', '',
    '<div class="callout-list"><div class="callout"><b>' + esc(d.label || id) + '</b><p>' +
    esc(descBody(d.desc) || 'desc 없음') +
    '</p></div>' +
    (d.formula ? '<div class="callout"><b>계산식</b><p class="mono">' + esc(d.formula) + '</p></div>' : '') +
    (kids.length ? '<div class="callout"><b>하위 요소 ' + kids.length + '개</b><p>' +
      kids.map(function(k){ return '<button class="rowlink" data-go="' + esc(k) + '">' + esc(MODEL[k].label || k) + '</button>'; }).join(' · ') +
      '</p></div>' : '') +
    '</div>');
  h += '</div>';

  // 분해 테이블
  if(kids.length){
    var rows = '';
    var parV = val(id, t);
    kids.forEach(function(k){
      var kv = val(k, t);
      var sh = parV !== 0 ? kv / parV : 0;
      rows += '<tr><td><span class="cellrow">' +
        (MODEL[k].type === 'input' ? '<i class="mark-input"></i>' : '<i class="legend-dot" style="background:' + nodeColor(k) + '"></i>') +
        '<button class="rowlink" data-go="' + esc(k) + '">' + esc(MODEL[k].label || k) + '</button>' +
        '<span style="color:' + T.mut + ';font-size:9px">' + esc(MODEL[k].u || '') + '</span></span></td>';
      for(var tt = 0; tt < YRS.length; tt++){
        rows += '<td class="' + (isHist(tt) ? 'hist' : '') + '">' + esc(fmtV(k, tt)) + '</td>';
      }
      rows += '<td><span class="contrib"><span class="contrib-bar"><i style="width:' +
        Math.min(100, Math.abs(sh) * 100).toFixed(1) + '%;background:' + nodeColor(k) + '"></i></span>' +
        (parV !== 0 && isSumOfChildren(id) ? (sh * 100).toFixed(1) + '%' : '—') + '</span></td></tr>';
    });
    rows += '<tr class="total"><td>' + esc(d.label || id) + '</td>';
    for(var tt2 = 0; tt2 < YRS.length; tt2++){ rows += '<td>' + esc(fmtV(id, tt2)) + '</td>'; }
    rows += '<td>100.0%</td></tr>';
    h += card('구성요소 분해', d.formula ? d.formula : '하위 노드 목록', d.u || '',
      '<div class="table-wrap"><table class="fm">' +
      yearTh('구성요소').replace('</tr>', '<th>' + esc(YRS[t]) + ' 비중</th></tr>') +
      rows + '</table></div>' +
      (isSumOfChildren(id) ? '' :
        '<p class="footnote">수식이 자식의 단순 합이 아니라 비중 열은 비워둡니다.</p>'));
  }

  // 입력 노드: 연도별 직접 편집
  if(isInput){
    var cells = '';
    for(var t3 = 0; t3 < YRS.length; t3++){
      var changed = DEFAULTS_S[id] && Math.abs((SV[id] ? SV[id][t3] : 0) - DEFAULTS_S[id][t3]) > 1e-9;
      cells += '<div class="inp-cell' + (isHist(t3) ? ' hist' : '') + (changed ? ' changed' : '') + '">' +
        '<label>' + esc(YRS[t3]) + (isHist(t3) ? ' (실적)' : '') + '</label>' +
        '<input type="number" step="any" data-inp="' + esc(id) + '" data-t="' + t3 + '" value="' +
        (SV[id] ? SV[id][t3] : 0) + '"></div>';
    }
    h += card('가정변수 직접 입력', '회색 = 실적 · 파란 테두리 = 초안에서 변경됨',
      d.u || '', '<div class="inp-grid">' + cells + '</div>');
  } else {
    // 자기 시계열
    h += card('연도별 값', '', d.u || '',
      '<div class="table-wrap"><table class="fm">' + yearTh('항목') + nodeTr(id, 0, 'total') + '</table></div>');
  }

  // 이 계정을 움직이는 가정변수 — 트리 하위가 아니라 수식 의존성 기준이다.
  // 서브트리 밖에 있는 드라이버(PREV, 공유 드라이버)도 여기서 잡힌다.
  var drivers = driversOf(id);

  // 하류 영향도 — 이 노드를 바꾸면 무엇이 흔들리는가
  var affects = descendantsOf(id);
  if(affects.length){
    var af = '';
    affects.sort(function(a, b){ return depthOf(a) - depthOf(b); }).forEach(function(k){
      af += '<tr><td><span class="cellrow">' +
        (MODEL[k].type === 'input' ? '<i class="mark-input"></i>' : '') +
        '<button class="rowlink" data-go="' + esc(k) + '">' + esc(MODEL[k].label || k) + '</button></span></td>' +

        '<td>' + esc(fmtV(k, t)) + '</td>' +
        '<td style="text-align:left"><span class="mono">' + esc(MODEL[k].formula || '') + '</span></td></tr>';
    });
    h += card('영향받는 계정 ' + affects.length + '개', '이 값을 바꾸면 다시 계산되는 노드', YRS[t] + ' 기준',
      '<div class="table-wrap"><table class="fm"><tr><th>계정</th><th style="text-align:left">단위</th>' +
      '<th>' + esc(YRS[t]) + '</th><th style="text-align:left">계산식</th></tr>' + af + '</table></div>');
  }
  if(drivers.length){
    var dr = '';
    drivers.forEach(function(k){
      dr += '<tr class="drv"><td><span class="cellrow"><i class="mark-input"></i>' +
        '<button class="rowlink" data-go="' + esc(k) + '">' + esc(MODEL[k].label || k) + '</button></span></td>' +
        '<td style="text-align:left;color:' + T.sec + '">' + esc(MODEL[k].u || '') + '</td>' +
        '<td>' + esc(fmtV(k, t)) + '</td>' +
        '<td style="text-align:left;font-size:9.5px;color:' + T.body + ';white-space:normal;max-width:420px">' +
        esc(descBody(MODEL[k].desc).slice(0, 120)) + '</td></tr>';
    });
    h += card('연결된 가정변수 ' + drivers.length + '개', '', YRS[t] + ' 기준',
      '<div class="table-wrap"><table class="fm"><tr><th>가정변수</th><th style="text-align:left">단위</th>' +
      '<th>' + esc(YRS[t]) + '</th><th style="text-align:left">근거</th></tr>' + dr + '</table></div>');
  }

  return h + '</div>';
}

// 수식이 자식들의 단순 합인지 (기여도 % 표시 가능 여부)
function isSumOfChildren(id){
  var d = MODEL[id]; if(!d || !d.formula) return false;
  var kids = childrenOf(id).slice().sort();
  if(!kids.length) return false;
  var toks = d.formula.split('+').map(function(s){ return s.trim(); });
  if(toks.length !== kids.length) return false;
  var ok = true;
  toks.slice().sort().forEach(function(x, i){ if(x !== kids[i]) ok = false; });
  return ok;
}

// ── 요약 대시보드 ──
function renderSummary(){
  var r = rootId(), t = UI.year, kids = childrenOf(r);
  var h = '<div class="page">';
  h += '<div class="page-head"><div class="eyebrow caps">' + ic('home', 16) + ' Overview</div>' +
    '<h1>' + esc(MODEL[r].label || r) + '</h1>' +
    '<p class="page-desc">' + esc(descBody(MODEL[r].desc)) + '</p>' +
    '<div class="badge-row"><span class="badge hist">실적 ' + HIST_N + '개년</span>' +
    '<span class="badge calc">추정 ' + (YRS.length - HIST_N) + '개년</span>' +
    '<span class="badge input">가정변수 ' + nInputs() + '개</span>' +
    '<span class="badge unit">' + esc(MODEL[r].u || '') + '</span>' +
    '<button class="tb-btn" data-canvas="' + esc(r) + '" style="margin-left:4px">' +
      ic('git-branch', 16) + ' 전체 캔버스</button></div></div>';

  // KPI 카드 행은 제거했다 — 같은 숫자를 아래 차트가 막대 위 값 라벨로 직접 보여준다.
  // 검증 이슈 건수는 사이드바 `검증·이슈` 항목에 그대로 표시된다.

  var series = kids.map(function(k){ return { label:MODEL[k].label || k, color:nodeColor(k), values:MODEL[k].v || [] }; });
  h += '<div class="grid two">';
  h += card('구성요소 누적 추이', kids.length + '개 계정 · 회색 = 실적', MODEL[r].u || '',
    legendHTML(series) + chartSVG(series, { stacked:isSumOfChildren(r), height:36 }));

  var mixRows = '';
  // 합계 트리에서만 부모값이 구성비의 분모가 된다. 뺄셈 루트에서는
  // 자식 절대값 합을 쓴다 — 그러지 않으면 비중이 100%를 넘는다.
  var mixIsSum = isSumOfChildren(r);
  var tot = mixIsSum ? val(r, t)
    : kids.reduce(function(s, k){ return s + Math.abs(val(k, t)); }, 0);
  kids.forEach(function(k){
    var v = val(k, t), sh = tot ? v / tot : 0;
    mixRows += '<tr><td><span class="cellrow"><i class="legend-dot" style="background:' + nodeColor(k) + '"></i>' +
      '<button class="rowlink" data-go="' + esc(k) + '">' + esc(MODEL[k].label || k) + '</button></span></td>' +
      '<td>' + esc(fmtV(k, t)) + '</td>' +
      '<td><span class="contrib"><span class="contrib-bar"><i style="width:' +
      Math.min(100, Math.abs(sh) * 100).toFixed(1) + '%;background:' + nodeColor(k) + '"></i></span>' +
      (tot ? (sh * 100).toFixed(1) + '%' : '—') + '</span></td></tr>';
  });
  h += card(YRS[t] + (mixIsSum ? ' 구성비' : ' 구성 (절대값 기준)'), '', MODEL[r].u || '',
    '<div class="table-wrap"><table class="fm"><tr><th>계정</th><th>' + esc(YRS[t]) + '</th><th>비중</th></tr>' +
    mixRows + '</table></div>');
  h += '</div>';

  // 상위 2단계 요약 테이블
  var rows = '';
  (function walk(id, lvl){
    rows += nodeTr(id, lvl, lvl === 0 ? 'total' : (MODEL[id].type === 'input' ? 'drv' : 'sub'));
    if(lvl < 2) childrenOf(id).forEach(function(k){ walk(k, lvl + 1); });
  })(r, 0);
  h += card('계정 요약 (상위 3단계)', '', MODEL[r].u || '',
    '<div class="table-wrap"><table class="fm">' + yearTh('계정') + rows + '</table></div>');
  return h + '</div>';
}

// ══ 투자심사 뷰 ═══════════════════════════════════════════════
// 아래 세 뷰의 숫자는 전부 MODEL에서 나온다. 시뮬레이터에서 가정을 바꾸면
// 목표가와 상승여력이 그 자리에서 따라 움직인다.

// 마지막 추정 연도 인덱스
function icLastIdx(){ return YRS.length - 1; }

// 매출 노드를 찾는다. 엔진이 'total_revenue'라는 이름을 전제하고 있었고,
// 단일 제품 회사(노드명 'revenue')에서 리포트가 매출 대신 루트를 그렸다.
// 세 번째 종목을 태우다 발견했다 — 이름을 전제하지 않고 관례를 순서대로 찾는다.
// META.revenueNode로 명시할 수도 있다.
function revenueId(){
  if(typeof META === 'object' && META && META.revenueNode && MODEL[META.revenueNode])
    return META.revenueNode;
  var conv = ['total_revenue', 'revenue', 'sales', 'total_sales', 'net_sales'];
  for(var i = 0; i < conv.length; i++) if(MODEL[conv[i]]) return conv[i];
  return rootId();
}

// 적정가치와 현재 시총의 괴리. 모델 루트가 시가총액일 때만 뜻이 있다.
function icUpside(t){
  if(typeof MARKET !== 'object' || !MARKET || !MARKET.mktcap) return null;
  var fair = val(rootId(), t);
  if(!fair) return null;
  return fair / MARKET.mktcap - 1;
}
function icUpsideLabel(){
  var u = icUpside(icLastIdx());
  return u === null ? '' : (u >= 0 ? '+' : '') + (u * 100).toFixed(0) + '%';
}
// 현재 시총이 함의하는 EV/EBITDA 배수 — 역산.
// "적정가가 얼마인가"보다 "지금 가격이 무엇을 전제하는가"가 심사에서 더 유용하다.
function icImpliedMultiple(t){
  if(typeof MARKET !== 'object' || !MARKET || !MODEL.ebitda) return null;
  var e = val('ebitda', t);
  if(!e) return null;
  var nd = MODEL.net_debt ? val('net_debt', t) : 0;
  return (MARKET.mktcap + nd) / e;
}

// fmtMoney는 축약할 때 이미 단위를 붙인다(예: "10.35조원"). 그 뒤에 UNITS.money를
// 다시 붙이면 "조원억원"이 된다. 축약되지 않았을 때만 단위를 붙인다.
function icMoney(v){
  var s = fmtMoney(v);
  return /[가-힣]$/.test(s) ? s : s + UNITS.money;
}

function icStat(label, value, sub, tone){
  return '<div class="kpi' + (tone ? ' ' + tone : '') + '">' +
    '<div class="k">' + esc(label) + '</div>' +
    '<div class="v">' + esc(value) + '</div>' +
    (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div>';
}

function icMarketNote(){
  if(typeof MARKET !== 'object' || !MARKET) return '';
  return '<div class="notice">시장 관측치 기준일 <b>' + esc(MARKET.asOf) + '</b> · ' +
    esc(MARKET.source || '') + ' — <b>심사 시점에 반드시 갱신</b>.</div>';
}

// 목표배수 사다리. 현재 가정을 끼워 넣고 정렬해 중복을 없앤다.
function icMulLadder(){
  var base = [8, 10, 12, 15, 20, 25, 30];
  var cur = MODEL.target_ev_ebitda ? val('target_ev_ebitda', icLastIdx()) : null;
  if(cur && base.every(function(m){ return Math.abs(m - cur) > 0.01; })) base.push(cur);
  return base.sort(function(a, b){ return a - b; });
}

function renderICValuation(){
  var t = icLastIdx(), h = '<div class="page">';
  var cur0 = MODEL.target_ev_ebitda ? val('target_ev_ebitda', t) : 0;
  h += '<div class="page-head"><div class="eyebrow caps">' + ic('trending-up', 16) +
    ' Investment case</div><h1>밸류에이션</h1></div>';
  if(typeof MARKET !== 'object' || !MARKET){
    return h + '<div class="notice">MARKET 미선언 — 시장 대비 비교 불가.</div></div>';
  }
  h += icMarketNote();

  // 배수 민감도는 EBITDA 배수법 모델에서만 뜻이 있다. DCF 모델(ebitda 노드가 없는
  // 트리)에서는 이 카드를 건너뛰고 피어·컨센서스·판단만 보여준다.
  // 두 번째 종목 KT&G를 태우다 이 화면이 통째로 비는 것을 발견했다.
  if(MODEL.ebitda){
  // 배수 민감도 — 목표배수 × 추정연도.
  // 현재 가정을 목록에 반드시 끼운다. 없으면 "굵은 행이 현재 가정"이 거짓말이 된다.
  var muls = icMulLadder();
  var head = '<tr><th>목표 EV/EBITDA</th>';
  for(var i = HIST_N; i < YRS.length; i++) head += '<th>' + esc(YRS[i]) + '</th>';
  head += '</tr>';
  var body = '';
  muls.forEach(function(m){
    var cur = MODEL.target_ev_ebitda ? val('target_ev_ebitda', t) : null;
    body += '<tr' + (cur && Math.abs(cur - m) < 0.01 ? ' class="hl"' : '') + '><td>' + m + '배</td>';
    for(var i = HIST_N; i < YRS.length; i++){
      var nd = MODEL.net_debt ? val('net_debt', i) : 0;
      var fair = val('ebitda', i) * m - nd;
      var up = fair / MARKET.mktcap - 1;
      body += '<td class="' + (up >= 0 ? 'pos' : 'neg') + '">' +
        (up >= 0 ? '+' : '') + (up * 100).toFixed(0) + '%</td>';
    }
    body += '</tr>';
  });
  h += card('목표배수 민감도', '칸 값 = 현재 시가총액 대비 괴리. 굵은 행이 현재 가정.', '',
    '<div class="table-wrap"><table class="fm">' + head + body + '</table></div>');

  // 역산 — 현재 가격이 무엇을 전제하는가
  var need = [];
  icMulLadder().filter(function(m, i){ return i % 2 === 0 || Math.abs(m - cur0) < 0.01; })
    .forEach(function(m){
    var nd = MODEL.net_debt ? val('net_debt', t) : 0;
    var reqE = (MARKET.mktcap + nd) / m;
    var gap = reqE / val('ebitda', t);
    need.push('<tr' + (Math.abs(m - cur0) < 0.01 ? ' class="hl"' : '') + '><td>' + m +
      '배</td><td>' + esc(icMoney(reqE)) + '</td>' +
      '<td>' + gap.toFixed(2) + '배</td></tr>');
  });
  h += card('역산 — 현재 가격이 전제하는 것',
    '현재 시가총액을 정당화하려면 ' + YRS[t] + '에 필요한 EBITDA', UNITS.money,
    '<div class="table-wrap"><table class="fm"><tr><th>목표배수 가정</th>' +
    '<th>필요 EBITDA</th><th>모델 대비</th></tr>' + need.join('') + '</table></div>');
  }

  // DCF 모델에서는 루트 자체를 연도별로 펼쳐 보여준다.
  if(!MODEL.ebitda){
    var dcf = '';
    for(var k2 = HIST_N; k2 < YRS.length; k2++){
      var f3 = val(rootId(), k2), u4 = f3 / MARKET.mktcap - 1;
      dcf += '<tr' + (k2 === t ? ' class="hl"' : '') + '><td>' + esc(YRS[k2]) + '</td>' +
        '<td>' + esc(fmtV(rootId(), k2)) + '</td>' +
        '<td>' + (MARKET.shares
          ? Math.round(f3 * 1e8 / MARKET.shares).toLocaleString('ko-KR') + '원' : '—') + '</td>' +
        '<td class="' + (u4 >= 0 ? 'pos' : 'neg') + '">' +
          (u4 >= 0 ? '+' : '') + (u4 * 100).toFixed(0) + '%</td></tr>';
    }
    h += card('추정기간별 적정가치', '추정기간이 그 해에 끝난다고 볼 때의 값', UNITS.money,
      '<div class="table-wrap"><table class="fm"><tr><th style="text-align:left">기준 연도</th>' +
      '<th>적정 시가총액</th><th>주당</th><th>현재가 대비</th></tr>' + dcf + '</table></div>');
  }

  h += icConsensusCard();
  h += icPeerCard();
  h += icMemoCard('valuation', '밸류에이션 판단');
  return h + '</div>';
}

// 케이스별로 모델을 다시 풀어 지정한 노드의 값을 읽는다.
// SV를 임시로 갈아끼우므로 반드시 원래대로 되돌린다.
function icSolve(overrides, nodeIds, t){
  var backup = {};
  for(var k in SV) backup[k] = SV[k].slice();
  try{
    if(overrides){
      for(var k2 in overrides){
        if(SV[k2] && overrides[k2].length === YRS.length) SV[k2] = overrides[k2].slice();
      }
    }
    simCalc();
    var out = {};
    nodeIds.forEach(function(id){ out[id] = val(id, t); });
    return out;
  } finally {
    for(var k3 in backup) SV[k3] = backup[k3];
    simCalc();      // 화면에 남은 상태를 원래대로
  }
}

function renderICScenario(){
  var t = icLastIdx(), h = '<div class="page">';
  h += '<div class="page-head"><div class="eyebrow caps">' + ic('layers', 16) +
    ' Investment case</div><h1>시나리오</h1></div>';
  if(typeof SCENARIOS !== 'object' || !SCENARIOS){
    return h + '<div class="notice">SCENARIOS 미선언 — data.js에 시나리오 프리셋을 둘 것.</div></div>';
  }
  h += '<div class="notice">Base = 초안값 그 자체 · 시뮬레이터 케이스 바에서 전환 시 모델에 적용. ' +
    '시나리오는 <b>[주관] 노드만</b> 변경 — 공시 확정 실적은 전 케이스 동일.</div>';

  var revId = revenueId();
  var want = [revId, 'op_profit', 'ebitda', rootId()];
  var cases = [{ name:'Base', ov:null }];
  for(var nm in SCENARIOS) cases.push({ name:nm, ov:SCENARIOS[nm] });
  var solved = cases.map(function(c){ return icSolve(c.ov, want, t); });

  var mc = (typeof MARKET === 'object' && MARKET) ? MARKET.mktcap : 0;
  var rows = '';
  cases.forEach(function(c, i){
    var s = solved[i];
    var up = mc ? s[rootId()] / mc - 1 : null;
    var tone = c.name === 'Base' ? ' class="hl"' : '';
    rows += '<tr' + tone + '><td><b>' + esc(c.name) + '</b></td>' +

    '<th>영업이익</th><th>OPM</th><th>EBITDA</th><th>적정 시총</th>' +
    '<th>현재가 대비</th></tr>' + rows + '</table></div>');

  // 무엇을 흔들었는지 — 가정을 감추지 않는다

// 피어 비교 — 목표배수의 근거를 화면에 붙인다.
function icPeerCard(){
  if(typeof PEERS !== 'object' || !PEERS || !PEERS.list) return '';
  var self = null, rows = '', lastMkt = null;
  // 시장이 섞여 있으면 구분 행을 넣는다. 환율 없이 비교하려면 배수만 봐야 하고,
  // 시가총액 열은 통화가 달라 나란히 두면 오독을 만든다.
  var multiMkt = PEERS.list.some(function(x){ return x.market && x.market !== PEERS.list[0].market; });
  PEERS.list.forEach(function(p){
    if(p.group === 'self') self = p;
    if(multiMkt && p.market !== lastMkt){
      lastMkt = p.market;
      rows += '<tr class="total"><td colspan="7" style="text-align:left">' +
        esc(p.market || '기타') + '</td></tr>';
    }
    var ev = p.evEbitda || [], per = p.per || [];
    var f = function(x){ return (x === null || x === undefined) ? '—' : x.toFixed(1) + '배'; };
    rows += '<tr' + (p.group === 'self' ? ' class="hl"' : '') + '>' +
      '<td>' + esc(p.name) + '</td>' +
      '<td>' + esc(p.group === 'self' ? '—' : p.group) + '</td>' +
      // 해외 피어는 현지 통화라 원화 축약에 태울 수 없다. 문자열 그대로 보여준다.
      '<td>' + esc(p.mktcap == null ? (p.cap || '—') : fmtMoney(p.mktcap)) + '</td>' +
      '<td>' + f(ev[0]) + '</td><td>' + f(ev[1]) + '</td>' +
      '<td>' + f(per[1]) + '</td>' +
      '<td>' + esc(p.ret1y || '—') + '</td></tr>';
  });
  // 표만 주면 순위가 눈에 안 들어온다. 같은 값을 막대로 한 번 더 보여준다.
  var bars = PEERS.list.filter(function(p){ return p.evEbitda && p.evEbitda[0] != null; })
    .sort(function(a, b){ return b.evEbitda[0] - a.evEbitda[0]; })
    .map(function(p){
      return { label:p.name + (p.market ? ' (' + p.market + ')' : ''),
               value:p.evEbitda[0], strong:p.group === 'self',
               color:p.group === 'self' ? ICV.rev : (p.market === '해외' ? ICV.rev2 : ICV.cost),
               text:p.evEbitda[0].toFixed(1) + '배' };
    });
  var barCard = bars.length ? icChartCard('EV/EBITDA 순위',
    '실적(TTM) 기준 · 굵은 행이 본 종목', icSvgHBars(bars)) : '';

  var note = '<div class="notice">' + esc(PEERS.note || '') +
    ' 기준일 <b>' + esc(PEERS.asOf) + '</b> · ' + esc(PEERS.source || '') + '</div>';
  if(PEERS.missing) note += '<div class="notice">' + esc(PEERS.missing) + '</div>';
  return note + barCard + card('피어 그룹 비교', 'EV/EBITDA는 실적(A)과 당해 컨센서스(E)', UNITS.money,
    '<div class="table-wrap"><table class="fm"><tr><th style="text-align:left">종목</th><th>구분</th>' +
    '<th>시가총액</th><th>EV/EBITDA (A)</th><th>EV/EBITDA (E)</th>' +
    '<th>PER (E)</th><th>1년 수익률</th></tr>' + rows + '</table></div>');
}

// ── 분기 확정값 ───────────────────────────────────────────────
// QUARTERLY는 공시 원문에서 기계가 만든다(tools/build_quarterly.py).
// 모델의 시간축은 연간이므로 이 값들은 모델에 들어가지 않는다 — 옆에 두고
// "모델이 그린 경로 위를 실제로 걷고 있는가"를 묻는 데만 쓴다.
function qHas(){ return typeof QUARTERLY === 'object' && QUARTERLY && QUARTERLY.quarters; }
function qKeys(){ return qHas() ? Object.keys(QUARTERLY.quarters).sort() : []; }
function qYear(k){ return parseInt(k.slice(0, 4), 10); }

// 파생 지표까지 여기서 낸다. 기타비용 = 매출 − 영업이익 − 감가상각비 로,
// 모델의 비용 분해와 같은 정의다 (02_cost_methodology).
function qVal(k, seg, metric){
  if(!qHas()) return null;
  var rec = QUARTERLY.quarters[k];
  if(!rec || !rec[seg]) return null;
  var r = rec[seg], rev = r['매출'], op = r['영업이익'], dep = r['감가상각비'];
  if(metric === '영업이익률') return (rev ? op / rev : null);
  if(metric === '기타비용률') return (rev != null && op != null && dep != null && rev)
    ? (rev - op - dep) / rev : null;
  var v = r[metric];
  return v === undefined ? null : v;
}
// 전년 동기 대비. 분기 데이터에서 계절성을 걷어내는 최소한의 장치다.
function qYoY(k, seg, metric){
  var prev = (qYear(k) - 1) + k.slice(4);
  var a = qVal(prev, seg, metric), b = qVal(k, seg, metric);
  return (a && isFinite(a) && a !== 0) ? b / a - 1 : null;
}
function qFmt(metric, v){
  if(v === null || v === undefined || !isFinite(v)) return '—';
  if(metric === '영업이익률' || metric === '기타비용률') return (v * 100).toFixed(1) + '%';
  return fmtSmart(v);
}

function renderICMonitor(){
  var h = '<div class="page">';
  h += '<div class="page-head"><div class="eyebrow caps">' + ic('activity', 16) +

    return h + '<div class="notice">분기 확정값(QUARTERLY) 미선언 — ' +
      'tools/build_quarterly.py 로 생성해 data.js 옆에 quarterly.json 으로 두면 화면 활성화.</div></div>';
  }
  var ks = qKeys(), last = ks[ks.length - 1];
  h += '<div class="notice">' + esc(QUARTERLY._출처 || '') +
    ' · 최신 확정 <b>' + esc(last) + '</b> · 단위 ' + esc(QUARTERLY._단위 || '') +
